sarily produce a fair decision."},"B":{"type":"review","tag":"c5-o2","text":"Family circumstances matter, but a supervisor should follow established criteria and staffing requirements."},"C":{"type":"review","tag":"c5-o2","text":"Student activities may merit consideration without automatically outranking every other request."},"D":{"type":"preferred","text":"Transparent job-related criteria are fairer than ranking private circumstances.","tag":"aligned"},"E":{"type":"review","tag":"c5-o2","text":"Employees can suggest swaps, but the supervisor remains accountable for consistent criteria and qualified coverage."}},"family":"c5-o2","acceptable":{}},{"id":"C5Q05","chapter":5,"objective":2,"scenario":"The same dependable employees repeatedly delay their scheduled breaks. What works?","choices":["Review coverage, build a visible rotation, and ensure breaks occur as required.","Shorten breaks for everyone so the most reliable employees are not singled out.","Continue asking dependable employees because they are willing to help.","Ask employees to volunteer for missed breaks instead of assigning coverage.","Tell employees to stop expecting identical treatment when abilities differ."],"answer":"A","rationale":"Workload fairness requires examining repeated patterns, not only intentions.","feedback":{"A":{"type":"preferred","text":"Workload fairness requires examining repeated patterns, not only intentions.","tag":"aligned"},"B":{"type":"review","tag":"c5-o2","text":"Shorter breaks shift the consequences of poor coverage onto everyone."},"C":{"type":"review","tag":"c5-o2","text":"Using dependable employees again rewards reliability with repeatedly missed breaks."},"D":{"type":"review","tag":"c5-o2","text":"Voluntary missed breaks do not replace the obligation to plan appropriate coverage."},"E":{"type":"review","tag":"c5-o2","text":"Different abilities affect assignments, but required breaks still need to occur fairly."}},"family":"c5-o2","acceptable":{}},{"id":"C5Q06","chapter":5,"objective":2,"scenario":"A guest angrily accuses an employee of rudeness; the employee disputes the story. What next?","choices":["Address the guest's immediate concern and gather facts before private coaching.","Publicly defend the employee because staff should see unconditional support.","Accept the guest's version immediately because the customer experienced the interaction.","Offer the guest a complimentary meal and say the worker will be coached before hearing both sides.","Ask the worker to apologize immediately, then discuss what occurred after the guest leaves."],"answer":"A","rationale":"Resolve immediate service needs without deciding contested facts prematurely.","feedback":{"A":{"type":"preferred","text":"Resolve immediate service needs without deciding contested facts prematurely.","tag":"aligned"},"B":{"type":"review","tag":"c5-o2","text":"Publicly taking a side before checking facts can make the guest concern worse."},"C":{"type":"review","tag":"c5-o2","text":"The guest’s experience deserves attention, but their accusation is not yet a verified account of events."},"D":{"type":"review","tag":"c5-o2","text":"Promising employee discipline before hearing both accounts sacrifices fairness for quick appeasement."},"E":{"type":"review","tag":"c5-o2","text":"Demanding an immediate apology may make an unsupported accusation appear confirmed."}},"family":"c5-o2","acceptable":{}},{"id":"C5Q07","chapter":5,"objective":3,"scenario":"Two student workers tell you that the evening rotation is unfair because one coworker is assigned to the lighter beverage-and-dessert station almost every shift. What should you do first?","choices":["Swap the two complaining students onto the beverage station for the next three shifts so the crew sees an immediate responsiveness to their concern.","Explain that daily station assignments depend on operational factors that supervisors weigh privately, and encourage them to focus on their own work.","Post a blank sign-up sheet in the breakroom next week so evening workers can claim stations on a first-come, first-served basis at clock-in.","Ask the coworker who has been working the beverage station to rotate onto the dishroom tonight so teammates do not resent them.","Audit the past two weeks of station logs against training and coverage criteria, hear the workers' concerns, and adjust the rotation transparently."],"answer":"E","rationale":"Reviewing actual assignment records and cross-training gaps before changing the schedule allows the supervisor to fix real inequities systematically rather than reacting with ad-hoc swaps.","feedback":{"A":{"type":"review","tag":"c5-o3","text":"Swapping assignments to appease the complainants may create another unfair rotation."},"B":{"type":"review","tag":"c5-o3","text":"Keeping the criteria secret prevents employees from understanding or evaluating a legitimate assignment concern."},"C":{"type":"review","tag":"c5-o3","text":"First-come station selection may ignore required training and peak-period coverage."},"D":{"type":"review","tag":"c5-o3","text":"Moving the favored employee immediately could punish them for a decision they did not make."},"E":{"type":"preferred","text":"Reviewing actual assignment records and cross-training gaps before changing the schedule allows the supervisor to fix real inequities systematically rather than reacting with ad-hoc swaps.","tag":"aligned"}},"family":"c5-o3","acceptable":{}},{"id":"C5Q08","chapter":5,"objective":3,"scenario":"An employee tells you that your tone discourages questions. How should you respond?","choices":["Survey coworkers about the employee's attitude before discussing your own tone.","Record the comment as resistance to supervision in the employee's file.","Thank them, ask for examples, and consider a change you can test.","Tell them that your direct communication style is not meant personally.","Speak to the employee less often so the issue is less likely to recur."],"answer":"C","rationale":"Receiving upward feedback without defensiveness supports psychological safety.","feedback":{"A":{"type":"review","tag":"c5-o3","text":"Surveying coworkers about the speaker’s attitude evades the specific concern about your communication."},"B":{"type":"review","tag":"c5-o3","text":"Documenting a good-faith concern as resistance discourages future upward feedback."},"C":{"type":"preferred","text":"Receiving upward feedback without defensiveness supports psychological safety.","tag":"aligned"},"D":{"type":"review","tag":"c5-o3","text":"Explaining your intention does not address the effect of your tone on employees."},"E":{"type":"review","tag":"c5-o3","text":"Communicating less avoids the opportunity to practice respectful and clear supervision."}},"family":"c5-o3","acceptable":{}},{"id":"C5Q09","chapter":5,"objective":3,"scenario":"Two shifts blame one another for missed closing handoffs over several weeks. What helps?","choices":["Rotate several workers between shifts so they understand each side's workload.","Enforce only the morning shift's checklist to create a single reference.","Ask both shift leads to send separate issue reports to upper management.","Allow the lead employees to settle disputes privately without a shared record.","Create one handoff method with clear status, ownership, and verification."],"answer":"E","rationale":"A shared, observable process is stronger than competing narratives.","feedback":{"A":{"type":"review","tag":"c5-o3","text":"Rotation can broaden empathy, but without shared handoff facts the underlying conflict remains."},"B":{"type":"review","tag":"c5-o3","text":"One shift’s standard should not win by default without examining the actual requirements."},"C":{"type":"review","tag":"c5-o3","text":"Separate reports can multiply competing stories rather than establish one reliable process."},"D":{"type":"review","tag":"c5-o3","text":"Private conversations alone may fail to produce a durable cross-shift agreement."},"E":{"type":"preferred","text":"A shared, observable process is stronger than competing narratives.","tag":"aligned"}},"family":"c5-o3","acceptable":{"A":"Cross-shift experience may improve mutual understanding if scheduling and qualifications permit. It still needs to result in a consistent shared handoff process."}},{"id":"C5Q10","chapter":5,"objective":4,"scenario":"An employee begins disclosing detailed medical history while asking for a work adjustment. What next?","choices":["Tell coworkers enough details to explain a possible change in assignments.","Offer a different station immediately without checking the authorized process.","Deny any adjustment until the employee provides a complete medical history.","Discuss work needs privately and follow the appropriate support process.","Ask for the full diagnosis so you can personally judge what duties are safe."],"answer":"D","rationale":"A supervisor can address job-related needs without collecting unnecessary medical details.","feedback":{"A":{"type":"review","tag":"c5-o4","text":"Coworkers generally do not need a diagnosis to understand work assignments."},"B":{"type":"review","tag":"c5-o4","text":"An immediate change can conflict with required processes and with the employee’s actual work restrictions."},"C":{"type":"review","tag":"c5-o4","text":"Demanding complete medical history intrudes on privacy and may be unnecessary to arrange support."},"D":{"type":"preferred","text":"A supervisor can address job-related needs without collecting unnecessary medical details.","tag":"aligned"},"E":{"type":"review","tag":"c5-o4","text":"A supervisor should discuss work requirements, not independently adjudicate an employee’s medical diagnosis."}},"family":"c5-o4","acceptable":{}},{"id":"C5Q11","chapter":5,"objective":4,"scenario":"A conflict agreement reduced arguments, but incomplete verbal handoffs continue. What next?","choices":["Mark the disagreement resolved because the employee relationship improved.","Remind everyone generally to act professionally during shift changes.","Ask teammates privately which employee is responsible for the remaining errors.","Separate the employees so they are never assigned to consecutive shifts.","Review the agreement, name the missed behavior, and revise the handoff step."],"answer":"E","rationale":"The purpose of follow-up is to verify behavior, not merely calmer feelings.","feedback":{"A":{"type":"review","tag":"c5-o4","text":"Fewer arguments are encouraging, but the handoff remains incomplete."},"B":{"type":"review","tag":"c5-o4","text":"Another general reminder does not define or verify the behavior that is still missing."},"C":{"type":"review","tag":"c5-o4","text":"Seeking a culprit can renew the conflict rather than improve the process."},"D":{"type":"review","tag":"c5-o4","text":"Separating the workers avoids developing a dependable handoff for future shifts."},"E":{"type":"preferred","text":"The purpose of follow-up is to verify behavior, not merely calmer feelings.","tag":"aligned"}},"family":"c5-o4","acceptable":{}},{"id":"C5Q12","chapter":5,"objective":4,"scenario":"You are preparing to conduct your first difficult attendance conversation. What supports transfer?","choices":["Conduct it without preparation to demonstrate independent supervisory judgment.","Plan and rehearse with a manager, hold the conversation, and follow up.","Have your manager conduct the conversation while you take notes in the room.","Send a formal email instead of holding a live conversation with the employee.","Wait for one more attendance problem so the evidence feels more convincing."],"answer":"B","rationale":"Rehearsal and coaching support independent performance rather than replace it.","feedback":{"A":{"type":"review","tag":"c5-o4","text":"Unprepared independence is not the same as sound supervisory judgment."},"B":{"type":"preferred","text":"Rehearsal and coaching support independent performance rather than replace it.","tag":"aligned"},"C":{"type":"review","tag":"c5-o4","text":"Watching your manager is useful, but you also need your own chance to practice the conversation."},"D":{"type":"review","tag":"c5-o4","text":"An email may document expectations, but it cannot fully replace a necessary live discussion."},"E":{"type":"review","tag":"c5-o4","text":"Waiting for another lapse delays fair, timely correction of a pattern already identified."}},"family":"c5-o4","acceptable":{"C":"Watching an experienced manager handle the first conversation can be a legitimate modeling opportunity. Plan for the new supervisor to lead a subsequent conversation with coaching."}}],"lessons":[{"title":"From Coworker to Supervisor","subtitle":"The Difference Between Authority and Leadership","html":"<p><strong>The difference between authority and leadership.</strong> Promotion grants formal authority. Moving from coworker to supervisor requires a <strong>paradigm shift</strong>: responsibility expands from completing assigned work to coordinating people, making fair decisions, and protecting the dining operation as a whole. Existing relationships remain important, but personal friendships and familiar routines cannot supersede supervisory responsibilities.</p><p><strong>Three skills, one role.</strong> Katz (1974) identifies <strong>technical skills</strong>, <strong>human skills</strong>, and <strong>conceptual skills</strong>. Together, they resemble a three-pronged fork: understanding the work, working effectively with people, and recognizing how decisions affect the wider operation. Technical expertise remains useful after promotion, but it does not replace communication or organizational judgment.</p><p><strong>Professional boundaries.</strong> Former coworkers may expect the same informal arrangements they enjoyed before the promotion. A supervisor must apply scheduling and performance standards consistently, protect <strong>confidentiality</strong>, and use job-related criteria when assigning desirable or undesirable work. Fairness does not require identical outcomes in different circumstances; it requires consistent reasoning and an accountable process.</p><p><strong>Coordinate rather than take over.</strong> A supervisor who returns to the grill for an entire lunch rush may resolve one production problem while leaving breaks, supplies, and other stations without direction. Hands-on assistance may be appropriate, but the supervisor retains responsibility for coordinating trained coverage and monitoring the whole shift.</p><p><strong>Credibility follows conduct.</strong> DeRue and Ashford (2010) describe <strong>leadership identity</strong> as a social process in which a person claims a leadership role and others recognize it. Consistent decisions, respectful accountability, and follow-through establish credibility more effectively than repeatedly invoking a title. The <strong>role transition</strong> requires new expectations without demanding personal distance from every former coworker.</p><p><strong>Humility strengthens judgment.</strong> A veteran cook may understand a piece of equipment better than the newly promoted supervisor. Recognizing that expertise and correcting an instruction when necessary protects the team. Supervisory authority does not require pretending to know everything (Owens &amp; Hekman, 2012).</p><p><strong>A practical decision standard.</strong> Before acting, consider whether the decision follows policy, treats employees fairly, protects service and safety, and accounts for competing needs across the shift. A sound decision can be explained without disclosing private information or relying on personal relationships.</p>"},{"title":"Communication and Delegation","subtitle":"Clear expectations, appropriate support, reliable handoffs","html":"<p><strong>Clarity precedes accountability.</strong> Instructions such as ‘move prep earlier tomorrow’ are incomplete unless employees know which tasks, stations, and deadlines have changed. Supervisors should identify the expected result, responsible person, deadline, and method for confirming completion before assuming that a missed assignment reflects poor effort.</p><p><strong>Effective delegation.</strong> A useful assignment specifies what must be done, who owns it, when it is due, and how progress will be checked. For example: ‘Jordan, prepare eight trays of cut vegetables by 10:45 using the updated prep sheet. Tell me at 10:15 if stock is short; I will check readiness at 10:40.’ The instruction establishes accountability without requiring the supervisor to perform the task.</p><p><strong>Match support to experience and risk.</strong> <strong>Instructional scaffolding</strong> provides temporary guidance that decreases as competence develops. <strong>Teach-back</strong> allows an employee to explain or demonstrate a critical step so both parties can confirm understanding. A required allergen procedure needs more immediate verification than an experienced worker’s routine count of shelf-stable supplies.</p><p><strong>Delegation is not micromanagement.</strong> Repeating an experienced employee’s entire inventory count creates duplicate work and signals distrust. Giving an unfamiliar assignment without instructions or a <strong>checkback</strong> can be equally ineffective. A proportionate follow-up protects quality while preserving employee ownership.</p><p><strong>Make handoffs durable.</strong> A freezer alarm or delayed delivery should be recorded through the approved system, not passed along through an informal conversation alone. A useful handoff identifies the observation, time, actions taken, current status, next action, and responsible person. The receiving shift should not have to reconstruct events from memory.</p><p><strong>Distribute opportunities fairly.</strong> Dependable employees should not automatically inherit every unpleasant task, and friendships should not determine who receives developmental assignments. Qualifications, workload, training opportunities, and consistent rotation provide more defensible criteria.</p><p><strong>Decision routine.</strong> Define the outcome, name the owner, communicate in a suitable format, confirm critical understanding, and establish a checkback. When performance falls short, review the instruction and working conditions before deciding what corrective response is necessary.</p>"},{"title":"Finding the Real Problem","subtitle":"Investigate causes before selecting a response","html":"<p><strong>Different causes require different interventions.</strong> A malfunctioning refrigerator, a failed ticket printer, and repeated prep delays may interrupt the same shift, but each requires its own response. Treating every disruption as an employee-performance problem misses equipment, staffing, and workflow conditions.</p><p><strong>Stabilize immediate risks.</strong> Suspected food-temperature or allergen failures require the approved food-safety response, including protecting affected products, verifying conditions, and escalating through authorized channels. Investigation must not delay action required to protect employees or guests.</p><p><strong>Apply dual perspective.</strong> Consider the employee’s circumstances before assigning blame while weighing the supervisor’s responsibilities and the needs of the operation. Incomplete closing tasks may reflect insufficient staffing, unclear instructions, inadequate training, equipment problems, or refusal to follow a reasonable requirement. The response should address the established cause, not an assumed motive.</p><p><strong>Look for <strong>system factors</strong>.</strong> Repeated delays may result from poor station layout, missing supplies, conflicting assignments, or a checklist employees interpret differently. Observing the work, reviewing records, and asking employees what prevents completion often produces more useful information than issuing another warning.</p><p><strong>Learning is not the answer to every problem.</strong> Daffron and Caffarella (2021) emphasize organizational context and <strong>needs assessment</strong> in program planning. The same principle applies here: a good supervisor investigates before assigning blame, and a good program planner investigates before prescribing training. Neither instruction nor discipline repairs broken equipment or creates missing staffing hours.</p><p><strong>Maintain accountability.</strong> Systems thinking does not excuse repeated disregard of clear, reasonable expectations. Once the facts establish that tools, training, and instructions are sufficient, coaching or formal action may be appropriate under the organization’s procedures.</p><p><strong>Learn from near misses.</strong> A worker who almost slips beside a leaking sink has identified a hazard even if nobody was injured. Protect the area, report the condition, and verify the repair. The absence of an injury does not establish that the operation was safe.</p><p><strong>Investigation sequence.</strong> Stabilize safety and service; gather observations and records; test plausible causes; choose an effective policy-compliant response; and verify whether the problem has improved. Ask what evidence would change the initial assessment.</p>"},{"title":"Feedback and Difficult Conversations","subtitle":"Address behavior directly and follow through","html":"<p><strong>Start with observable evidence.</strong> ‘The temperature log was incomplete on Tuesday and Thursday’ identifies a behavior that can be addressed. ‘You are careless’ assigns a personal label and invites defensiveness. Effective coaching focuses on the action, its effect, and the required standard.</p><p><strong>Use formative feedback.</strong> <strong>Formative feedback</strong> gives an employee information that can improve performance while there is time to change course. <strong>Behavior modeling</strong> can demonstrate an effective response, followed by practice and feedback. Agreement during a conversation is not evidence that the behavior has changed.</p><p><strong>Invite relevant context.</strong> An incomplete log may result from a missed step, a poorly placed form, unclear ownership, or deliberate noncompliance. Ask what happened, verify the explanation, and explain the applicable standard. Humility includes recognizing when a supervisory instruction or scheduling decision contributed to the difficulty (Owens &amp; Hekman, 2012).</p><p><strong>Agree on a specific next action.</strong> ‘Be more responsible’ is difficult to implement or assess. ‘Complete the log before station handoff and confirm the entry with the closer’ gives both parties a concrete expectation. Determine what support is needed and when performance will be checked.</p><p><strong>Coach without public humiliation.</strong> Address immediate safety or service risks promptly; conduct detailed performance discussions privately when possible. An employee developing speed while maintaining accuracy benefits from a measurable practice goal, not an unfavorable comparison with the fastest coworker.</p><p><strong>Recognize improvement.</strong> Feedback should identify effective performance as well as errors. Naming an improvement in closing records or accurate handoffs shows employees which behaviors are worth continuing.</p><p><strong>Document and revisit.</strong> Use the organization’s approved process for recurring or serious concerns. Record observable facts, agreed actions, and follow-up dates rather than speculation about character or motivation. If an agreement fails, reassess the conditions instead of repeating the same conversation.</p><p><strong>Conversation sequence.</strong> Observation, effect or standard, employee perspective, concrete next step, and follow-up. Supervisory accountability is clearer when expectations can be observed and checked.</p>"},{"title":"Conflict and Putting It Into Practice","subtitle":"Resolve the problem and verify the result","html":"<p><strong>Address both conduct and cause.</strong> A conflict between shifts can involve disrespectful behavior and an unresolved operational problem. Stop immediate unsafe or abusive conduct, preserve service, and determine what happened before deciding how the process or individuals should be addressed.</p><p><strong>Separate evidence from interpretation.</strong> Review records, assigned responsibilities, and applicable procedures. Ask each person to describe observable events rather than another employee’s intentions. Both accounts may contain useful information even when the explanations conflict.</p><p><strong>Maintain psychological safety and standards.</strong> <strong>Psychological safety</strong> allows employees to report concerns and ask questions without humiliation or retaliation. It does not remove accountability. A supervisor should interrupt discriminatory remarks, including mockery of an employee’s accent, and follow the organization’s conduct and reporting procedures.</p><p><strong>Protect personal information.</strong> Requests involving medical details or workplace adjustments belong in authorized channels. Focus on the job-related request, explain the appropriate process, and avoid sharing private information with coworkers.</p><p><strong>Make agreements testable.</strong> ‘Communicate better’ does not show what will change. ‘The closing lead records unfinished prep, current status, and the next owner before signing out’ establishes a standard that both shifts can verify. Set a follow-up date and revisit the agreement if the problem continues.</p><p><strong>Apply consistent criteria.</strong> Requests for time off, preferred assignments, and break coverage require fair application of documented policies and operational needs, not judgments about whose personal circumstances deserve more sympathy. Supervisors should also consider employee feedback about their own communication and conduct.</p><p><strong>Plan for training transfer.</strong> <strong>Training transfer</strong> occurs when participants use the skills outside the learning activity. <strong>Transfer climate</strong> matters: managers must support coaching, feedback, and reasonable practice opportunities (Blume et al., 2010). A completed quiz does not establish workplace competence.</p><p><strong>Put the plan into practice.</strong> Prepare an opening statement for a difficult conversation, rehearse it with a facilitator, use it when an appropriate situation arises, and document the follow-up. Improvement is measured through workplace actions, not merely lesson completion.</p>"}],"glossary":{"scaffolding":"Temporary support that changes with the learner’s demonstrated needs and fades as they become more independent.","delegation":"Assigning work with clear ownership, expectations, and appropriate follow-up.","teach-back":"Asking someone to explain or demonstrate a critical step to confirm the instruction was understood.","checkback":"A planned point for confirming progress or completion without controlling every action.","root cause":"An underlying condition that helps explain why a problem keeps happening.","system factors":"Workplace conditions such as tools, staffing, instructions, layout, and processes that influence performance.","formative feedback":"Information used during learning to help someone improve a particular decision or behavior.","training transfer":"Using what was learned in training in a real workplace setting.","confidentiality":"Keeping private personnel or other sensitive information within authorized channels.","near miss":"An event that could have caused harm even though no injury occurred.","role boundary":"A clear distinction between personal relationships and supervisory responsibilities.","technical skills":"Knowledge and proficiency in the methods and tasks that employees perform, such as safe food production and daily dining operations.","human skills":"The abilities that help a supervisor communicate, coach, collaborate, address conflict, and build trust.","conceptual skills":"The ability to understand how staffing, budgets, service, equipment, and organizational decisions affect one another.","dual perspective":"Considering both the employee’s experience and the supervisor’s responsibility, while accounting for the wider operation.","needs assessment":"A structured way to learn which gaps require training and which problems require organizational or resource changes.","behavior modeling":"Learning from examples of effective and ineffective behavior, followed by practice and feedback.","transfer climate":"The workplace conditions that encourage or discourage employees from using new skills after training.","psychological safety":"A shared sense that people can raise questions or concerns without interpersonal punishment; it does not remove accountability.","humility":"Recognizing limits, taking responsibility for mistakes, appreciating coworkers’ expertise, and remaining willing to learn.","leadership identity":"The understanding of who leads in a group, developed through relationships and repeated interactions, not solely a job title.","role transition":"The adjustment from personally performing tasks to guiding people, resources, and competing responsibilities.","paradigm shift":"A fundamental change in how someone understands a role and approaches decisions; in supervision, the move from individual performance to responsibility for the wider team."},"sources":[["Daffron & Caffarella (2021): Planning programs for adult learners (4th ed.)","https://www.wiley.com/en-us/planning-programs-for-adult-learners-a-practical-guide-4th-edition-p-9781119577386"],["Katz (1974): Skills of an effective administrator","https://hbr.org/1974/09/skills-of-an-effective-administrator"],["Benson, Li, & Shue (2019): Promotions and the Peter Principle","https://doi.org/10.1093/qje/qjz022"],["Lacerenza et al. (2017): Leadership training meta-analysis","https://doi.org/10.1037/apl0000241"],["Taylor, Russ-Eft, & Chan (2005): Behavior modeling training meta-analysis","https://doi.org/10.1037/0021-9010.90.4.692"],["Blume et al. (2010): Transfer of training meta-analysis","https://doi.org/10.1177/0149206309352880"],["Galinsky et al. (2008): Perspective-taking in negotiations","https://doi.org/10.1111/j.1467-9280.2008.02096.x"],["Van de Pol, Volman, & Beishuizen (2010): Scaffolding review","https://doi.org/10.1007/s10648-010-9127-6"],["Shute (2008): Focus on formative feedback","https://doi.org/10.3102/0034654307313795"],["Sadler (1989): Formative assessment and instructional systems","https://doi.org/10.1007/BF00117714"],["K-State Housing and Dining: Student employment","https://housing.k-state.edu/resources/employment/student-dining/"],["W3C WCAG 2.2: Accessibility guidance","https://www.w3.org/TR/WCAG22/"],["Owens & Hekman (2012): Modeling how to grow: Humble leader behaviors","https://doi.org/10.5465/amj.2010.0441"],["Owens, Johnson, & Mitchell (2013): Expressed humility in organizations","https://doi.org/10.1287/orsc.1120.0795"],["DeRue & Ashford (2010): Leadership identity construction","https://doi.org/10.5465/amr.35.4.zok627"]],"photos":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBQYIBwcIChELCgkJChUPEAwRGBUaGRgVGBcbHichGx0lHRcYIi4iJSgpKywrGiAvMy8qMicqKyr/2wBDAQcICAoJChQLCxQqHBgcKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKir/wAARCALcBRQDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAwECBAUGAAcI/8QARxAAAQMDAwIEAwYDBgUEAgAHAQACAwQRIQUSMQZBEyJRYTJxgQcUI0KRoRVSsSQzYnLB0SU0Q4LhFlOS8Bfxc6I1g7Jjwv/EABoBAQEBAQEBAQAAAAAAAAAAAAABAgMEBQb/xAArEQEBAAICAgEFAAIDAQEAAwAAAQIRAyESMUEEEyIyUQVhFEJxIzNSkeH/2gAMAwEAAhEDEQA/AMkaWQHBR4Y5mnDirFsBe4NY25Kt6PTIadokqcu7NXiwwufp6LlIq6PTqypcDctZ6lXcFLTUbRvtI/1XT1oDdsflb6BV01eAvXhxY4uOWdq0krXPG1vlHayjvfG2MvneAFUP1B7iduAqbUKqae43kBdWF7Pr2nwktB3KM3qWiDrhiyD2Ouc5QHB7Pmg3Duo6R49LrhWQVP8AdyW+ZWGEgbbcVIbVkW2lNG2yFIXkubMAUCaGohaT94a72us19+qSBscbet0oqy1340rnH0uoq2fU1N8sEg9lzIG1LT4sGz3VYNXdF5Y24TJtamLebIJcmmUMMoJAPqmyVlLTeWGMAeoVLNqMj73cSor5XSDJTYsKqlbWAup5LO9FDb49G8CQEW7qKKmSF9wSLKbFrbHs2VTA8eqm sVvj6Z5G2XAJeq7qqSWy4hKlsgBkJLJ5SWQDNQnApbJqAeHJwchJ10ATMnZkIFLdAPzLk3dcgP/Z"],"photoAlts":["A supervisor confers with a kitchen team during a shift briefing.","A kitchen supervisor discusses a work checklist with two employees.","A supervisor studies a preparation concern with a colleague.","A supervisor and employee discuss expectations at a table.","Three food-service colleagues talk through a workplace disagreement."],"lensCases":[{"title":"Managing the role transition","situation":"A newly promoted supervisor is asked by a former close coworker to take over the grill during a rush. Break coverage and staffing decisions are also pending.","employee":"Your friend might be overwhelmed or may still see you as a fellow cook rather than the person coordinating the shift.","supervisor":"You have responsibility for the whole operation, including breaks, food safety, and who is covering each station.","question":"What would you ask before deciding whether to step onto the grill?"},{"title":"The assignment that never landed","situation":"You asked a student employee to finish the prep count before lunch. They say they thought you meant after lunch; you feel certain your instructions were clear.","employee":"The worker may have heard a different deadline, lacked context, or been interrupted by a competing task.","supervisor":"An inaccurate count affects ordering, production, and the next shift. You need a dependable handoff.","question":"What one question could reveal the misunderstanding without assigning blame?"},{"title":"Slow closing, busy kitchen","situation":"The closing team repeatedly leaves work unfinished. Morning employees are frustrated and are beginning to accuse particular coworkers of laziness.","employee":"Closing workers may lack training, equipment, adequate staffing, or a clear sequence of priorities.","supervisor":"Food safety and a fair handoff cannot be optional. A repeated failure requires investigation and follow-through.","question":"What would you verify before choosing between retraining, operational changes, or corrective feedback?"},{"title":"Your strongest cook says no","situation":"A respected veteran cook openly dismisses a required safety check because they have never needed it before. Other employees are listening.","employee":"The veteran may feel their expertise is being questioned or believe a long-standing shortcut is harmless.","supervisor":"Food-safety standards apply consistently, and public embarrassment may make a necessary correction harder.","question":"How would you preserve the standard without turning the disagreement into a contest of egos?"},{"title":"Two teams, two stories","situation":"The morning team accuses the closing team of leaving equipment dirty. Closing staff say morning workers misuse shared supplies and never acknowledge the extra tasks they inherit.","employee":"Both groups may believe they are carrying the heavier burden, and each sees only part of the handoff.","supervisor":"The handoff has to protect safe service regardless of whose explanation sounds more convincing.","question":"What evidence and follow-up would help both teams move beyond their competing stories?"}],"supports":{"c1-o1":"The loudest station is not necessarily the whole problem. Scan coverage, breaks, safety, and service before choosing where you personally help.","c1-o2":"Being fair does not mean saying yes to everyone or no to every friend. Use the same job-related criteria and explain the process.","c1-o3":"Your credibility survives a correction when your judgment improves because of it. Ask what the experienced worker knows that you may not.","c1-o4":"Authority comes with boundaries and responsibilities. Explain expectations, protect privacy, and use the approved process.","c2-o1":"Name the outcome, the owner, the deadline, and a proportionate check. Delegation should develop competence rather than conceal a handoff.","c2-o2":"For a handoff, identify what changed, who needs to know, how they can confirm it, and who owns the next action.","c2-o3":"Check whether the person has seen a demonstration and can show the task back. More talking is not always more learning.","c2-o4":"A shared task still needs named owners and a verification point. Watch for hidden burdens on the employees you trust most.","c3-o1":"Protect people and food first when risk is immediate. Then organize a reliable temporary process and investigate the failure.","c3-o2":"Do not diagnose motivation from a bottleneck. Observe sequence, capacity, equipment, and information flow.","c3-o3":"A suspected safety problem is not just an employee-performance issue. Follow the approved safeguard before debating responsibility.","c3-o4":"A near miss or self-reported error is evidence to investigate. Preserve safe operations and make it easier for workers to report concerns.","c4-o1":"Feedback should name the observed action and the applicable standard. Praise and correction can coexist without personal labels.","c4-o2":"Respond to the actual scheduling or service context, not a story about someone’s character. Correct immediate risk first.","c4-o3":"Check your records and decide what can be verified at the next shift. An accusation or promise of improvement alone is not a plan.","c4-o4":"A conversation is not finished when everyone nods. Confirm a specific next action and revisit it with evidence.","c5-o1":"Stabilize service and interrupt unsafe or disrespectful conduct before deciding what caused the argument.","c5-o2":"Fairness involves consistent standards, privacy, and context. Ask whether the proposed solution transfers the burden to somebody else.","c5-o3":"Gather facts from the people involved, but avoid making the affected worker solely responsible for stopping inappropriate behavior.","c5-o4":"An agreement must work after the conversation ends. Define the observable behavior, owner, and next check."}};

function chapterProgress(ch){if(state.done.includes(ch)||chapterReady(ch))return 100;let seen=unique(ch);if(!seen)return 0;let latest=latestResults(ch);let correct=Object.values(latest).filter(Boolean).length;let raw=Math.min(97,Math.round(66*seen/12+25*correct/12+6*Math.max(0,history(ch).length-12)/6));state.maxProgress[ch]=Math.max(state.maxProgress[ch]||0,raw);return state.maxProgress[ch]}

function welcome(){state.phase='welcome';render(`<div class="eyebrow">Maple Hall Dining · Leadership learning lab</div><div class="hero"><div><h1 id="focushead">Leading Without a Map</h1><p class="lede">Practical supervisory decisions in a university dining operation.</p><p>Practice managing professional relationships, delegation, operational problems, feedback, and conflict at Maple Hall Dining.</p></div><img src="${DATA.photos[0]}" alt="${esc(DATA.photoAlts[0])}"></div><div class="card"><h2>The Difference Between Authority and Leadership</h2><p>A promotion grants formal authority. Supervising former coworkers requires a <strong>paradigm shift</strong>: the desire to preserve existing relationships and routines cannot supersede fair decisions, professional boundaries, or the needs of the dining operation.</p><p>Katz (1974) identifies three management skills: technical, human, and conceptual. Together they resemble a three-pronged fork. Strong individual performance may justify promotion, but it does not establish managerial readiness (Benson et al., 2019).</p><div class="skillstrip"><div><strong>Know the work</strong><span>Technical skills</span></div><div><strong>Lead the people</strong><span>Human skills</span></div><div><strong>See the whole</strong><span>Conceptual skills</span></div></div><p>Supervision also requires investigating problems before assigning blame. Understaffing, unclear instructions, equipment failures, and unmet performance expectations call for different responses. This learning lab uses workplace decisions, feedback, and changing information to build judgment.</p><p>This self-paced demo supplements the proposed five instructor-supported sessions; it does not replace practice, discussion, or follow-up at work (Lacerenza et al., 2017; Taylor et al., 2005).</p>${!storageWorks?'<div class="note">Progress saving is unavailable in this browser session. Keep this tab open if you want to continue.</div>':''}<div class="actions"><button class="action /* Richard Lawrence Stenlund: language should open doors. */
function glossary(text){
 const terms=Object.entries(DATA.glossary).sort((a,b)=>b[0].length-a[0].length);
 const seen=new Set();
 // Only alter visible text nodes, never tag names or HTML attributes.
 return text.split(/(<[^>]+>)/g).map(segment=>{
   if(segment.startsWith('<'))return segment;
   for(const [term,def] of terms){
     if(seen.has(term))continue;
     const pattern=new RegExp('\\b('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:s|es)?)\\b','i');
     if(!pattern.test(segment))continue;
     const safeTerm=term.replace(/'/g,"\\'");
     const view=segment.replace(pattern,`<button class="glossbtn" type="button" data-definition="${esc(def)}" title="${esc(def)}" aria-label="$1. Definition available" onclick="showGloss('${safeTerm}',this)">$1<span class="glosshint" aria-hidden="true">?</span></button>`);
     segment=view;seen.add(term);
   }
   return segment;
 }).join('')
}
function positionGloss(){
 const g=document.getElementById('glossary');
 if(!g||g.hidden||!lastGlossBtn||!lastGlossBtn.isConnected)return;
 const rect=lastGlossBtn.getBoundingClientRect(),gap=10,pad=12;
 const width=g.offsetWidth,height=g.offsetHeight;
 const vw=document.documentElement.clientWidth,vh=window.innerHeight;
 const left=Math.max(pad,Math.min(rect.left,vw-width-pad));
 let top=rect.bottom+gap;
 if(top+height>vh-pad){
   top=rect.top-height-gap>=pad?rect.top-height-gap:Math.max(pad,vh-height-pad);
 }
 g.style.left=Math.round(left)+'px';
 g.style.top=Math.round(top)+'px';
}
function showGloss(term,btn){
 const g=document.getElementById('glossary');if(!g)return;
 if(lastGlossBtn&&lastGlossBtn!==btn)lastGlossBtn.setAttribute('aria-expanded','false');
 lastGlossBtn=btn;
 btn.setAttribute('aria-controls','glossary');btn.setAttribute('aria-expanded','true');
 g.classList.add('gloss-popover');g.setAttribute('role','dialog');
 g.hidden=false;
 g.innerHTML=`<strong>${esc(term)}</strong><p>${esc(DATA.glossary[term])}</p><button class="action secondary" type="button" onclick="closeGloss()">Close definition</button>`;
 document.body.classList.add('gloss-open');
 positionGloss();
 g.focus({preventScroll:true});
}
function closeGloss(restoreFocus=true){
 const g=document.getElementById('glossary');if(g)g.hidden=true;
 document.body.classList.remove('gloss-open');
 if(lastGlossBtn){lastGlossBtn.setAttribute('aria-expanded','false');if(restoreFocus&&lastGlossBtn.isConnected)lastGlossBtn.focus({preventScroll:true})}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.glossbox.gloss-popover:not([hidden])')){e.preventDefault();closeGloss()}});
document.addEventListener('pointerdown',e=>{
 const g=document.getElementById('glossary');
 if(g&&!g.hidden&&!g.contains(e.target)&&!e.target.closest('.glossbtn'))closeGloss(false);
});
window.addEventListener('resize',positionGloss);
window.addEventListener('scroll',()=>{
 const g=document.getElementById('glossary');
 if(g&&!g.hidden)closeGloss(false);
},{passive:true});
function glosslist(ch){let content=DATA.lessons[ch-1].html.toLowerCase();let entries=Object.entries(DATA.glossary).filter(([term])=>content.includes(term.toLowerCase())||content.includes(term.toLowerCase()+'s'));return `<details><summary>Chapter glossary</summary>${entries.map(([term,val])=>`<p><strong>${esc(term)}:</strong> ${esc(val)}</p>`).join('')}</details>`}
function lensHtml(ch){const item=DATA.lensCases?.[ch-1];if(!item)return '';return `<details class="lens"><summary>Try another angle: ${esc(item.title)}</summary><p>${esc(item.situation)}</p><p><strong>What would you ask first?</strong> ${esc(item.question)}</p><button class="action secondary" type="button" onclick="showLens(this,${ch})">Consider both perspectives</button><div class="lenscompare" hidden></div></details>`}
function showLens(btn,ch){let item=DATA.lensCases?.[ch-1],el=btn.nextElementSibling;if(!item||!el)return;let expanded=!el.hidden;el.hidden=expanded;btn.textContent=expanded?'Consider both perspectives':'Hide the perspectives';btn.setAttribute('aria-expanded',String(!expanded));if(!expanded){el.innerHTML=`<div class="perspectives"><div><strong>From the employee's side</strong><p>${esc(item.employee)}</p></div><div><strong>From the supervisor's side</strong><p>${esc(item.supervisor)}</p></div></div><p class="meta">Ask questions and check the facts before making a decision.</p>`}}

function trailFeedback(option){return `<strong>${LABELS[option.level]}.</strong> ${esc(option.why)}`}
function decisionLabHtml(ch){let t=TRAILS[ch];if(!t)return '';let st=state.lab?.[ch]||{};return `<details class="decision-lab" ${st.stage?'open':''}><summary>${esc(t.title)}</summary><p>${esc(t.intro)}</p><p class="lab-instruction">Choose a response. Then consider what changes when new information arrives.</p><p><strong>${esc(t.first.prompt)}</strong></p><div class="lab-choices" id="lab-one">${t.first.options.map((x,i)=>`<button class="lab-option" type="button" aria-pressed="${st.first===i}" onclick="labChoose(${ch},1,${i})">${ABC[i]}. ${esc(x.text)}</button>`).join('')}</div><div id="lab-reveal">${labRevealHtml(ch,st)}</div></details>`}

function pick(ch){let items=chItems(ch),h=history(ch),latest=latestResults(ch),seen=new Set(h.map(x=>x.id));let pending=state.pendingGap[ch];let unused=items.filter(q=>!seen.has(q.id));let pool=unused.length?unused:items.filter(q=>latest[q.id]!==true);if(!pool.length)pool=items;
 if(pending){let nearby=pool.filter(q=>q.id!==pending.origin&&q.family===pending.family);if(nearby.length)pool=nearby;delete state.pendingGap[ch]}
 let counts={};h.forEach(e=>counts[e.id]=(counts[e.id]||0)+1);pool.sort((a,b)=>(counts[a.id]||0)-(counts[b.id]||0)||a.id.localeCompare(b.id));return pool[0]}
function question(){let ch=state.chapter;if(chapterReady(ch))return reflection();let q=pick(ch);state.current=q.id;state.lastAnswer=null;state.phase='question';state.order=[0,1,2,3,4];let prior=history(ch).filter(e=>e.id===q.id).length;if(prior){let shift=prior%5;state.order=state.order.map(i=>(i+shift)%5)}showQuestion()}
function showQuestion(){state.phase=state.lastAnswer!==null?'answered':'question';let ch=state.chapter,q=Q.find(x=>x.id===state.current);if(!q){return question()}let h=history(ch),revisit=h.some(e=>e.id===q.id);let answered=state.phase==='answered';let opt=state.order||[0,1,2,3,4];render(`<div class="eyebrow">Chapter ${ch} of ${CHAPTERS} · Workplace decision</div><h1 id="focushead">${esc(DATA.lessons[ch-1].title)}</h1>${progressHtml(ch)}${h.length>=14?'<div class="note"><strong>Take your time.</strong> Revisit the lesson or discuss a similar problem with your instructor. There is no time limit.</div>':''}<div class="card"><span class="tag">Maple Hall shift scenario</span><h2>${esc(q.scenario)}</h2><p>Which action would you take first? More than one response may be defensible; think about what each one assumes.</p><div class="choices">${opt.map((j,i)=>`<button class="choice" id="opt${i}" data-letter="${ABC[j]}" onclick="answer('${ABC[j]}')" ${answered?'disabled':''}><span class="letter">${ABC[i]}</span><span>${esc(q.choices[j])}</span></button>`).join('')}</div><div id="response" aria-live="polite"></div></div><details><summary>Review this chapter's lesson</summary><div class="lesson">${glossary(DATA.lessons[ch-1].html)}${lensHtml(ch)}</div><div class="glossbox" id="glossary" role="region" aria-label="Glossary definition" tabindex="-1" hidden></div>${glosslist(ch)}</details><div class="actions"><button class="action ghost" onclick="lesson()">Return to lesson</button><button class="action ghost" onclick="welcome()">Pause / return to overview</button></div>`);if(answered)showFeedback(q,state.lastAnswer)}
function answer(letter){if(state.phase!=='question'||state.lastAnswer!==null)return;let q=Q.find(x=>x.id===state.current),ch=state.chapter,quality=letter===q.answer?2:(q.acceptable&&q.acceptable[letter]?1:0),ok=quality>0;state.lastAnswer=letter;state.phase='answered';(state.history[ch]??=[]).push({id:q.id,correct:ok,quality,option:letter});if(!ok){let fam=q.family;(state.wrongTags[ch]??={})[fam]=((state.wrongTags[ch]||{})[fam]||0)+1;state.pendingGap[ch]={family:fam,origin:q.id}}showFeedback(q,letter);nav();let p=document.querySelector('.chapterprogress');if(p)p.outerHTML=progressHtml(ch);save()}
/* Richard Lawrence Stenlund: an acceptable answer deserves a reason. */
function showFeedback(q,letter){let quality=letter===q.answer?2:(q.acceptable&&q.acceptable[letter]?1:0),ch=state.chapter;document.querySelectorAll('.choice').forEach(el=>{el.disabled=true;let isChosen=el.dataset.letter===letter,isPreferred=el.dataset.letter===q.answer;el.classList.toggle('chosen',isChosen);el.classList.toggle('preferred',isPreferred);if(isChosen||isPreferred){let t=document.createElement('span');t.className='sr-only';t.textContent=isChosen&&isPreferred?' Your selection. Most complete response.':isChosen?(quality===1?' Your selection. Defensible, with conditions.':' Your selection. Reconsider the trade-off.'):' Most complete response.';el.appendChild(t)}});
let extra='';if(quality===0){let times=state.wrongTags[ch]?.[q.family]||0;if(times>=2)extra=`<p><strong>One useful way to approach this:</strong> ${esc(DATA.supports[q.family])}</p>`}
let text=quality===2?`<p>${esc(q.rationale)}</p>`:quality===1?`<p><strong>Your choice:</strong> “${esc(q.choices[ABC.indexOf(letter)])}”</p><p>${esc(q.acceptable[letter])}</p><p><strong>A more complete response:</strong> “${esc(q.choices[ABC.indexOf(q.answer)])}”</p><p>${esc(q.rationale)}</p>`:`<p><strong>Your choice:</strong> “${esc(q.choices[ABC.indexOf(letter)])}”</p><p>${esc(q.feedback[letter].text)}</p><p><strong>Consider another approach:</strong> “${esc(q.choices[ABC.indexOf(q.answer)])}”</p><p>${esc(q.rationale)}</p>${extra}`;
document.getElementById('response').innerHTML=`<div class="feedback ${quality===2?'':quality===1?'acceptable':'review'}" role="status" tabindex="-1"><h3>${quality===2?'A well-supported decision':quality===1?'Defensible, with conditions':'Consider this distinction'}</h3>${text}</div><div class="actions"><button class="action" onclick="nextDecision()">${chapterReady(ch)?'Continue':'Next workplace situation'}</button></div>`;document.querySelector('#response .feedback')?.focus({preventScroll:true});save()}

function nextDecision(){return chapterReady(state.chapter)?reflection():question()}
const samples=[
['“I want us to use the same closing standard for everyone. Can we talk privately about what happened and agree on the next step?”','Avoid making exceptions just to preserve a friendship or using a supervisory title to silence concerns.'],
['“Could you take ownership of the prep count by 10:45? Let’s confirm the expected result and check it together before lunch.”','Avoid taking the task back at the first question or leaving the outcome and deadline unstated.'],
['“Before we assume this is an employee problem, let’s check the equipment, instructions and shift timing.”','Avoid assigning blame before investigating whether the system makes success possible.'],
['“I noticed two incomplete handoffs this week. What was happening at close, and what would help us meet the standard?”','Avoid labeling the person as careless or offering a correction without a follow-up.'],
['“First, let’s keep service safe and steady. After the rush I want to hear both perspectives and agree on a reliable handoff.”','Avoid treating a quiet shift as proof the conflict has been resolved.']
];
function reflection(){let ch=state.chapter,l=DATA.lessons[ch-1];state.phase='reflection';render(`<div class="eyebrow">Chapter ${ch} · Applied reflection</div><h1 id="focushead">Take it into the workplace</h1>${progressHtml(ch)}<div class="card"><p>You have worked through this chapter's situations. Before moving on, consider how you would apply the ideas with an actual team.</p>${state.needsWorkshop[ch]?'<div class="note">Some decisions deserve conversation and live rehearsal. Bring a question from this chapter to your next workshop or coaching conversation.</div>':''}<h2>${esc(l.title)}</h2><p>Identify a workplace situation. What would you say first? What information would you check? How would you follow up?</p><label for="reflection">Your plan or opening words</label><textarea id="reflection" oninput="saveReflection(this.value)" placeholder="A situation I could face is…">${esc(state.reflection[ch]||'')}</textarea><div class="actions"><button class="action" onclick="compareReflection()">Compare with a workplace example</button></div><div id="reflectionHelp" role="region" aria-label="Reflection comparison" tabindex="-1" aria-live="polite">${state.refReviewed[ch]?sampleHtml(ch):''}</div>${state.refReviewed[ch]?`<div class="actions"><button class="action" onclick="finishChapter()">Save and continue</button></div>`:''}</div>`)}
function saveReflection(v){state.reflection[state.chapter]=v;save()}
function sampleHtml(ch){return `<div class="note"><strong>One useful opening:</strong><p>${esc(samples[ch-1][0])}</p><strong>Something to reconsider:</strong><p>${esc(samples[ch-1][1])}</p><p class="meta">Compare the example with your own reasoning; workplace circumstances and policies may require another response.</p></div>`}
function compareReflection(){let el=document.getElementById('reflection'),v=el?.value.trim();if(!v){el.focus();return}saveReflection(el.value);state.refReviewed[state.chapter]=true;document.getElementById('reflectionHelp').innerHTML=sampleHtml(state.chapter);let actions=document.getElementById('reflectionHelp').nextElementSibling;if(!actions){document.getElementById('reflectionHelp').insertAdjacentHTML('afterend','<div class="actions"><button class="action" onclick="finishChapter()">Save and continue</button></div>')}document.getElementById('reflectionHelp')?.focus({preventScroll:true});save()}
function finishChapter(){let ch=state.chapter;if(!(state.reflection[ch]||'').trim()){document.getElementById('reflection')?.focus();return}if(!state.refReviewed[ch])return;if(!state.done.includes(ch))state.done.push(ch);if(ch<CHAPTERS){state.chapter++;state.current=null;state.lastAnswer=null;state.phase='lesson';lesson()}else{state.phase='capstone';state.capstone??={step:0,choices:[],reflection:'',completed:false};capstone()}save()}

const FINAL_CHALLENGE=[
 {head:'A lunch rush with three problems',lead:'It is 12:08 p.m. The grill is behind, two students are waiting for break direction, and the dining director has requested a staffing update. The cook says the line is moving more slowly than usual.',question:'What do you do first?',choices:[
  ['Jump onto the grill for ten minutes while a student coordinates breaks.','Helping directly may protect service, but you have not confirmed that the student is trained or authorized to coordinate breaks. You also need to know why the grill is slow.'],
  ['Check what is slowing the station, determine safe qualified coverage, and keep responsibility for the full shift.','You are treating the entire shift as your responsibility without ignoring the employee who needs help. The next facts may change the plan.'],
  ['Ask the dining director to arrange relief before changing anything at the station.','Escalation can be necessary, but you can still assess the immediate facts and act within your authority while waiting for support.'],
  ['Reduce the advertised menu options immediately to shorten the line.','Adjusting service may eventually be appropriate, but first establish whether the problem is capacity, ingredients, equipment, or another condition.']
 ]},
 {head:'The facts change',lead:'The cook shows you that the grill is heating unevenly. The prepared ingredients are almost exhausted, and the only other qualified grill worker called out. A student employee mentions an earlier warning about the equipment.',question:'What should your next action protect?',choices:[
  ['Use the grill cautiously while checking temperatures more often than usual.','A suspected equipment safety problem calls for approved controls. Extra attention is not a substitute for verifying that cooking can be done safely.'],
  ['Pause the affected preparation, secure safe food handling, coordinate an approved service alternative, and update the director and team.','This protects food safety while addressing staffing, inventory, communication, and service together. If an approved alternative is unavailable, service at the affected station may need to stop.'],
  ['Pause the grill, ask the experienced cook to help identify a safe alternative, and call the director for authorized coverage.','This protects the immediate safety boundary and uses frontline knowledge. You still need to coordinate inventory, service communication, and follow-up rather than assuming the director will do everything.'],
  ['Wait for the director to return before making a change that could upset customers.','You may need management approval for a broader solution, but a suspected food-safety hazard cannot be ignored while waiting.']
 ]},
 {head:'A difficult conversation',lead:'After service stabilizes, the cook says your questions sounded like an accusation. You discover that yesterday’s equipment concern was reported but the handoff never reached you. The student worker also had a schedule adjustment that was not reflected on today’s staffing board.',question:'How would you address the people and the process?',choices:[
  ['Thank the cook for raising the concern, acknowledge your assumptions, check the reporting trail, and agree on immediate ownership and follow-up.','This considers the employee’s experience without overlooking the duty to document equipment and coverage failures. Admitting an incomplete assumption can strengthen accountability.'],
  ['Tell the cook the rush was stressful for everyone and move on now that service has recovered.','De-escalation matters, but the unsafe equipment report and missing schedule update still need clear corrective action.'],
  ['Explain that the previous supervisor caused the problem, so neither you nor the cook needs to revisit it.','A handoff failure may originate elsewhere, but your current responsibility is to stabilize the process and see that it is corrected.'],
  ['Acknowledge the cook’s concern, log the handoff gap, and ask the appropriate manager to own the process correction.','This recognizes the worker and escalates the gap. It needs an explicit checkback so that the new supervisor retains accountability for what happens next.']
 ]},
 {head:'One week later',lead:'The grill has been serviced and the staffing board was updated. The cook says they are more comfortable reporting concerns, but the evening crew still occasionally sends incomplete handoff notes. You are preparing for your next supervisory meeting.',question:'What would make the improvement last?',choices:[
  ['Personally inspect every piece of equipment before every meal and complete the handoff notes yourself.','Personal checking may help temporarily, but taking all responsibilities back undermines team ownership and may not be sustainable.'],
  ['Pilot a shared handoff checklist with the evening lead for a week, then discuss the results.','A practical trial can improve consistency, but both shifts must agree on the required fields, ownership, and how unresolved issues are checked.'],
  ['Confirm a shared handoff method with named owners, practice it with both shifts, and review the result after a week.','This turns the lesson into a workable process: specify the standard, involve employees, verify its use, and adjust if necessary.'],
  ['Discipline the employee whose last handoff was incomplete so everyone knows the new rules are serious.','Accountability remains important, but a repeated system problem deserves a clear shared standard and evidence before individual blame.']
 ]}
];
const CAPSTONE_LEVELS=[[1,2,1,0],[0,2,1,0],[2,0,0,1],[0,1,2,0]];
function ensureCapstone(){state.capstone??={step:0,choices:[],reflection:'',completed:false};state.capstone.choices??=[];state.capstone.step??=0;state.capstone.reflection??='';return state.capstone}
/* Richard Lawrence Stenlund: bring the learning full circle. */
function capstone(){const c=ensureCapstone();if(c.completed){state.phase='finished';return finish()};state.phase='capstone';const i=Math.min(c.step,FINAL_CHALLENGE.length);if(i>=FINAL_CHALLENGE.length)return capstoneReflection();let q=FINAL_CHALLENGE[i],sel=c.choices[i];let progress=FINAL_CHALLENGE.map((_,j)=>`<span class="capstone-dot ${j<i?'done':j===i?'active':''}" aria-hidden="true"></span>`).join('');render(`<div class="eyebrow">Final challenge · A changing situation</div><h1 id="focushead">When the map stops working</h1><p class="lede">One shift. Several competing demands. New facts that change your first answer.</p><div class="capstone-step">Decision ${i+1} of ${FINAL_CHALLENGE.length}</div><div class="capstone-progress" aria-label="Final challenge progress">${progress}</div><section class="card"><h2>${esc(q.head)}</h2><div class="capstone-context"><p>${esc(q.lead)}</p></div><p><strong>${esc(q.question)}</strong></p><div class="capstone-options">${q.choices.map((o,j)=>`<button type="button" class="capstone-option ${sel===j?'chosen':''}" aria-pressed="${sel===j}" onclick="chooseCapstone(${j})" ${sel!==undefined?'disabled':''}><strong>${ABC[j]}.</strong> ${esc(o[0])}</button>`).join('')}</div>${sel!==undefined?`<div class="capstone-feedback ${CAPSTONE_LEVELS[i][sel]===2?'':CAPSTONE_LEVELS[i][sel]===1?'acceptable':'review'}" role="status" tabindex="-1" id="capstoneFeedback"><strong>${LABELS[CAPSTONE_LEVELS[i][sel]]}</strong><p>${esc(q.choices[sel][1])}</p><p class="meta">The situation may change again. What assumptions does your plan depend on?</p></div><div class="actions"><button class="action" onclick="nextCapstone()">${i===FINAL_CHALLENGE.length-1?'Put the pieces together':'What happens next?'}</button></div>`:''}</section><p class="foot">Apply your workplace’s food-safety, staffing, and reporting procedures.</p>`)}
function chooseCapstone(choice){const c=ensureCapstone(),i=c.step;if(state.phase!=='capstone'||i>=FINAL_CHALLENGE.length||c.choices[i]!==undefined||choice<0||choice>=4)return;c.choices[i]=choice;const oldY=window.scrollY;capstone();window.scrollTo({top:oldY,behavior:'instant'});const feedback=document.getElementById('capstoneFeedback');feedback?.scrollIntoView({block:'nearest',behavior:'smooth'});feedback?.focus({preventScroll:true});save()}
function nextCapstone(){const c=ensureCapstone();if(c.step>=FINAL_CHALLENGE.length||c.choices[c.step]===undefined)return;c.step+=1;capstone();save()}
function chapterOneComparison(){const lab=state.lab?.[1];if(lab?.first!==undefined&&labOne[lab.first])return `At the start of Chapter 1, you considered: “${esc(labOne[lab.first])}”`;return 'In Chapter 1, you examined the difference between rescuing one station and leading an entire shift.'}
function capstoneReflection(){const c=ensureCapstone();if(c.choices.length<FINAL_CHALLENGE.length)return capstone();state.phase='capstone';render(`<div class="eyebrow">Final challenge · Reflection</div><h1 id="focushead">What changed in your thinking?</h1><p class="lede">A decision may have been reasonable before the facts changed. Leadership includes knowing when to revise it.</p><div class="card"><h2>Look back to Chapter 1</h2><div class="capstone-retrospective"><p>${chapterOneComparison()}</p><div class="capstone-snapshot"><div><strong>At the beginning</strong><p>You were managing a crowded grill station, break coverage, and a request for a staffing update.</p></div><div><strong>By the end</strong><p>You had to consider equipment safety, inventory, people’s perspectives, the handoff system, and follow-up.</p></div></div><p><strong>Your final follow-up choice:</strong> ${esc(FINAL_CHALLENGE[3].choices[c.choices[3]][0])}</p></div><label for="capstoneReflection"><strong>What would you do differently now, and how would you find out whether your decision actually helped?</strong></label><textarea id="capstoneReflection" rows="6" oninput="saveCapstoneReflection(this.value)" placeholder="At first I assumed ... Now I would check ... I'd follow up by ...">${esc(c.reflection)}</textarea><p class="meta">Write in your own words. The goal is thoughtful professional judgment, not a perfect answer.</p><div id="capstoneValidation" role="status" aria-live="polite"></div><div class="actions"><button class="action" onclick="completeCapstone()">Complete the learning lab</button></div></div>`)}
function saveCapstoneReflection(v){ensureCapstone().reflection=v;save()}
function completeCapstone(){const c=ensureCapstone();let v=document.getElementById('capstoneReflection')?.value||'';c.reflection=v;if(c.choices.length<FINAL_CHALLENGE.length||c.choices.some(x=>x===undefined))return;if(!v.trim()){document.getElementById('capstoneValidation').textContent='Please write a brief reflection before continuing.';document.getElementById('capstoneReflection')?.focus();save();return}c.completed=true;state.completedAt=state.completedAt||new Date().toISOString();state.phase='finished';finish();save()}
function setCertificateName(name){state.certificateName=String(name).slice(0,80);const preview=document.getElementById('certificate-name-preview');if(preview){const n=state.certificateName.trim();preview.textContent=n||'Your name here';preview.classList.toggle('long',n.length>27&&n.length<=43);preview.classList.toggle('very-long',n.length>43)}const err=document.getElementById('certNameError');if(err)err.textContent='';save()}
function completedDate(){return state.completedAt?new Intl.DateTimeFormat('en-US',{year:'numeric',month:'long',day:'numeric'}).format(new Date(state.completedAt)):'Completion date unavailable'}
function certificateMarkup(){const n=(state.certificateName||'').trim(),cls=n.length>43?'very-long':n.length>27?'long':'';return `<article class="certificate-paper" aria-label="Letter-size completion certificate"><div class="certificate-frame"><div><div class="cert-brand">Leading Without a Map</div><div class="cert-rule"></div><p class="cert-kicker">An interactive leadership learning lab</p><h2 class="cert-title">Certificate of Completion</h2></div><div><p class="cert-recipient-label">Presented to</p><div class="cert-name ${cls}" id="certificate-name-preview">${esc(n||'Your name here')}</div><p class="cert-copy">In recognition of completing the five learning chapters and the culminating workplace leadership challenge in</p><div class="cert-program">Leading Without a Map</div><p class="cert-copy">Practical Leadership Development for Newly Promoted Supervisors</p><p class="cert-statement">Completed practice in role transition, delegation, problem diagnosis, feedback, and conflict resolution.</p></div><div><div class="cert-rule"></div><div class="cert-date-label">Date of completion</div><div class="cert-date">${esc(completedDate())}</div><p class="cert-footer">Maple Hall Dining is a fictional instructional setting. This certificate recognizes completion of the interactive learning lab only; it does not certify professional competence, accredited training hours, or attendance at the proposed in-person workshop.</p></div></div></article>`}
function certificateView(){if(!ensureCapstone().completed)return capstone();state.phase='certificate';render(`<div class="eyebrow">Your completion certificate</div><h1 id="focushead">Certificate of completion</h1><p class="lede">Enter the name you would like printed, then preview your 8.5 × 11-inch certificate. Only the certificate will print, not the learning pages or your reflections.</p><div class="card"><label for="certName"><strong>Name to appear on the certificate</strong></label><input id="certName" class="certificate-input" type="text" maxlength="80" autocomplete="name" value="${esc(state.certificateName||'')}" oninput="setCertificateName(this.value)" placeholder="Your full name" style="display:block;width:100%;padding:12px 15px;border:2px solid #807588;border-radius:10px;font:inherit;margin:10px 0"><p class="meta">Completion date: ${esc(completedDate())}. For printing, choose US Letter (8.5 × 11), portrait, and turn on background graphics if your print dialog provides that option.</p><div class="actions"><button class="action" onclick="printCertificate()">Print certificate</button><button class="action secondary" onclick="finish()">Back to completion summary</button></div><p class="meta" id="certNameError" role="status" aria-live="polite"></p></div><div class="certificate-shell" id="certificatePreview">${certificateMarkup()}</div>`)}
function printCertificate(){if(!ensureCapstone().completed)return;const input=document.getElementById('certName');if(input)setCertificateName(input.value);if(!(state.certificateName||'').trim()){const e=document.getElementById('certNameError');if(e)e.textContent='Enter the name you would like printed first.';input?.focus();return}const host=document.getElementById('certificatePrintHost');if(!host)return;host.innerHTML=certificateMarkup();document.body.classList.add('print-certificate');save();window.print()}
window.addEventListener('afterprint',()=>document.body.classList.remove('print-certificate'));

function downloadReflections(){const lines=['Leading Without a Map: My supervisory practice notes',''];DATA.lessons.forEach((l,i)=>{lines.push(`${i+1}. ${l.title}`);lines.push(state.reflection[i+1]||'(not recorded)');lines.push('')});lines.push('Final challenge: What changed in your thinking?');lines.push(state.capstone?.reflection||'(not recorded)');lines.push('');const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Leading_Without_a_Map_Reflections.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function finish(){if(!ensureCapstone().completed){state.phase='capstone';return capstone()};state.phase='finished';render(`<div class="eyebrow">Learning lab · Completed</div><h1 id="focushead">Completion and next steps</h1><p class="lede">You have completed the five chapter activities and final challenge. Review your reflections, discuss difficult decisions with a facilitator, and apply the skills using your organization’s policies.</p><div class="card"><h2>Chapter reflections</h2>${DATA.lessons.map((l,i)=>`<div class="journey"><strong>${i+1}. ${esc(l.title)}</strong><span class="small"> · Complete</span>${state.reflection[i+1]?`<blockquote>${esc(state.reflection[i+1])}</blockquote>`:''}</div>`).join('')}<div class="capstone-retrospective"><strong>The final challenge: What changed in your thinking?</strong><blockquote>${esc(state.capstone.reflection||'')}</blockquote></div><p class="note">Take these reflections into your next workshop, coaching conversation, or workplace discussion.</p><div class="actions"><button class="action" onclick="certificateView()">View and print your certificate</button><button class="action secondary" onclick="document.body.classList.remove('print-certificate');window.print()">Print reflections</button><button class="action secondary" onclick="downloadReflections()">Save reflections as text</button><button class="action secondary" onclick="restart()">Try the learning lab again</button></div></div>${sourcesHtml()}`)}
// Dispatch on saved phase without replacing it with the welcome state.
state=load()||fresh();if(!state.history||!state.done)state=fresh();state.needsWorkshop??={};state.maxProgress??={};state.lab??={};state.reflection??={};state.refReviewed??={};state.capstone??={step:0,choices:[],reflection:'',completed:false};state.certificateName??='';state.completedAt??=null;state.wrongTags??={};state.pendingGap??={};
if(state.phase==='certificate')certificateView();else if(state.phase==='capstone')capstone();else if(state.phase==='finished')finish();else if(state.phase==='lesson')lesson();else if(state.phase==='question'||state.phase==='answered')showQuestion();else if(state.phase==='reflection')reflection();else welcome();
