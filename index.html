</style><script>
window.LWM_DATA={"questions":[{"id":"C1Q01","chapter":1,"objective":1,"scenario":"After your promotion, the grill station falls behind while breaks and guest requests need decisions. What is your best first response?","choices":["Ask the dining director to take over coordination until the grill catches up.","Reassign an available trained employee to the grill while you coordinate the whole shift.","Work the grill yourself until the backlog clears, then resume supervisory duties.","Stand beside the grill employee and direct each order to prevent another delay.","Keep the grill employee in place and spend the first few minutes observing the station before changing coverage."],"answer":"B","rationale":"Supervisory value comes from coordinating the whole operation; targeted staffing assistance preserves that responsibility.","feedback":{"A":{"type":"review","tag":"c1-o1","text":"The director may be needed later, but you still own coordinating the immediate shift."},"B":{"type":"preferred","text":"Supervisory value comes from coordinating the whole operation; targeted staffing assistance preserves that responsibility.","tag":"aligned"},"C":{"type":"review","tag":"c1-o1","text":"Your cooking skills would help one station while breaks and guest needs lose coordination."},"D":{"type":"review","tag":"c1-o1","text":"Directing every ticket turns you into a bottleneck and prevents the cook from working independently."},"E":{"type":"review","tag":"c1-o1","text":"Observing can uncover the cause, but the crew also needs timely support and shift-wide decisions."}},"family":"c1-o1","acceptable":{"E":"Brief observation can be a sensible diagnostic first move if urgent break and guest decisions are also covered. Do not let observation become inaction during a growing rush."}},{"id":"C1Q02","chapter":1,"objective":1,"scenario":"A close friend asks to be removed from Saturday closing for a concert. Coverage is already tight. How do you respond?","choices":["Decline immediately because approving a friend's request might look unfair.","Apply the usual swap policy and work with the employee to identify coverage.","Move another employee into the closing slot without mentioning the friendship.","Approve the request because the friendship predates your supervisory assignment.","Wait until Friday so someone else may volunteer to cover the shift."],"answer":"B","rationale":"Consistency is more defensible than either automatic favoritism or automatic denial.","feedback":{"A":{"type":"review","tag":"c1-o1","text":"Denying a legitimate request solely to avoid looking biased is another form of inconsistent treatment."},"B":{"type":"preferred","text":"Consistency is more defensible than either automatic favoritism or automatic denial.","tag":"aligned"},"C":{"type":"review","tag":"c1-o1","text":"Moving someone without checking their availability simply transfers the burden to another employee."},"D":{"type":"review","tag":"c1-o1","text":"Your friendship matters personally, but it cannot replace the staffing process used for others."},"E":{"type":"review","tag":"c1-o1","text":"Waiting until the last minute makes qualified coverage harder rather than protecting fairness."}},"family":"c1-o1","acceptable":{}},{"id":"C1Q03","chapter":1,"objective":1,"scenario":"A long-tenured cook says a newly promoted supervisor should not check their work. How should you respond?","choices":["Accept the cook's tenure as sufficient evidence that formal checks are unnecessary.","Acknowledge the cook's knowledge while keeping the normal quality checks in place.","Invite the cook to propose a lighter verification method while keeping the same quality standard.","Ask another supervisor to handle this cook whenever quality checks are required.","Ask the lead cook to sign off on this employee’s quality checks rather than reviewing them yourself."],"answer":"B","rationale":"Respecting expertise and maintaining consistent standards can occur together.","feedback":{"A":{"type":"review","tag":"c1-o1","text":"Experience is valuable, but required checks still apply to highly skilled employees."},"B":{"type":"preferred","text":"Respecting expertise and maintaining consistent standards can occur together.","tag":"aligned"},"C":{"type":"review","tag":"c1-o1","text":"Adapting the check may be reasonable if the standard and policy permit it; do not assume that flexibility is authorized."},"D":{"type":"review","tag":"c1-o1","text":"Handing off every difficult interaction avoids the supervisory responsibility rather than resolving it."},"E":{"type":"review","tag":"c1-o1","text":"A lead cook may assist with checks, but quietly shifting accountability does not establish a consistent process."}},"family":"c1-o1","acceptable":{"C":"Inviting a more efficient verification method respects expertise, provided the required standard and any mandated checks remain unchanged without authorization."}},{"id":"C1Q04","chapter":1,"objective":2,"scenario":"Former peers joke that you have 'gone management' when you remind them of closing requirements. What helps?","choices":["Ignore every remark and avoid discussing what has changed in your position.","Correct the jokes sharply to signal that informal relationships are now inappropriate.","Ask the director to explain your authority at the next all-staff meeting.","Recognize the transition and apply standards consistently and respectfully.","Relax minor closing requirements for a few weeks while the team adjusts."],"answer":"D","rationale":"Predictable, respectful conduct establishes role credibility better than status displays.","feedback":{"A":{"type":"review","tag":"c1-o2","text":"Silence may seem diplomatic, but the crew still needs a clear understanding of your new responsibilities."},"B":{"type":"review","tag":"c1-o2","text":"A sharp correction makes the joke a struggle over rank instead of a discussion about expectations."},"C":{"type":"review","tag":"c1-o2","text":"The director can support you, but everyday consistency is how you demonstrate credibility."},"D":{"type":"preferred","text":"Predictable, respectful conduct establishes role credibility better than status displays.","tag":"aligned"},"E":{"type":"review","tag":"c1-o2","text":"Relaxing requirements to preserve friendships teaches staff that the standard depends on personal relationships."}},"family":"c1-o2","acceptable":{}},{"id":"C1Q05","chapter":1,"objective":2,"scenario":"A dependable student requests a finals-week schedule change that would leave a coverage gap. What is reasonable?","choices":["Move an employee with fewer classes into the shift without checking availability.","Approve the adjustment immediately because academic responsibilities always take priority.","Review the documented swap process and help identify qualified coverage options.","Offer to split the shift so the student can attend the exam and work the busiest service period.","Deny the request because flexible scheduling would undermine team accountability."],"answer":"C","rationale":"A transparent process can accommodate academic needs without hiding coverage constraints.","feedback":{"A":{"type":"review","tag":"c1-o2","text":"A coworker’s lighter class load does not establish availability or consent to cover the shift."},"B":{"type":"review","tag":"c1-o2","text":"Approving first and solving coverage later overlooks obligations to other employees and guests."},"C":{"type":"preferred","text":"A transparent process can accommodate academic needs without hiding coverage constraints.","tag":"aligned"},"D":{"type":"review","tag":"c1-o2","text":"A split shift could work, but only after checking qualified coverage and applicable scheduling rules."},"E":{"type":"review","tag":"c1-o2","text":"A blanket denial overlooks the legitimate scheduling flexibility that student workers may need."}},"family":"c1-o2","acceptable":{"D":"A split shift might support the student and the operation if the exam time, staffing coverage, hours, and the normal approval process all allow it. Verify these first."}},{"id":"C1Q06","chapter":1,"objective":2,"scenario":"A former coworker asks why another employee met privately with management. What do you say?","choices":["Describe the general performance topic without sharing the specific outcome.","Share limited details if the coworker agrees not to repeat them.","Explain that personnel discussions are private and redirect to work needs.","Tell the coworker to ask the employee and report back if the matter affects the shift.","Change the subject with a joke, avoiding an explicit boundary about privacy."],"answer":"C","rationale":"Supervisory confidentiality works best when the boundary is clear and consistent.","feedback":{"A":{"type":"review","tag":"c1-o2","text":"Even a broad performance summary could reveal information that does not belong to this coworker."},"B":{"type":"review","tag":"c1-o2","text":"A promise of secrecy cannot turn private personnel information into appropriate workplace conversation."},"C":{"type":"preferred","text":"Supervisory confidentiality works best when the boundary is clear and consistent.","tag":"aligned"},"D":{"type":"review","tag":"c1-o2","text":"Sending a coworker to investigate creates gossip and avoids your own privacy boundary."},"E":{"type":"review","tag":"c1-o2","text":"A joke might deflect the question today but does not explain the boundary for next time."}},"family":"c1-o2","acceptable":{}},{"id":"C1Q07","chapter":1,"objective":3,"scenario":"An experienced cook corrects your equipment instruction in front of others, and the cook is right. What next?","choices":["Address the public correction as disrespectful before considering the technical issue.","Continue your initial instruction so the team does not see leadership uncertainty.","Tell employees that future technical disagreements must wait until after service.","Thank the cook for the correction and promptly update the team instruction.","Avoid future decisions about that equipment and refer them to the cook."],"answer":"D","rationale":"Acknowledging a factual correction models accountability and preserves operational safety.","feedback":{"A":{"type":"review","tag":"c1-o3","text":"The instruction is wrong; arguing about public disrespect before correcting it risks safety and trust."},"B":{"type":"review","tag":"c1-o3","text":"Preserving appearances is no reason to keep an incorrect equipment direction in place."},"C":{"type":"review","tag":"c1-o3","text":"You can discuss how to raise questions later, but first correct the information everyone is using."},"D":{"type":"preferred","text":"Acknowledging a factual correction models accountability and preserves operational safety.","tag":"aligned"},"E":{"type":"review","tag":"c1-o3","text":"Appreciating the cook’s expertise does not mean abandoning all responsibility for equipment decisions."}},"family":"c1-o3","acceptable":{}},{"id":"C1Q08","chapter":1,"objective":3,"scenario":"A short-staffed crew expects you to spend the entire rush cooking beside them. What should you do?","choices":["Assign a crew member to supervise while you take the vacant production station.","Coordinate coverage and provide brief help without abandoning shift oversight.","Tell staff that upper management must solve all shortages before you intervene.","Work the production station for the full rush and postpone other decisions.","Delay scheduled breaks until staffing returns to the normal level."],"answer":"B","rationale":"Supervisors must adapt capacity without abandoning coordination or established breaks.","feedback":{"A":{"type":"review","tag":"c1-o3","text":"A crew member may not have the authority or training to assume shift supervision."},"B":{"type":"preferred","text":"Supervisors must adapt capacity without abandoning coordination or established breaks.","tag":"aligned"},"C":{"type":"review","tag":"c1-o3","text":"A staffing shortage is your immediate problem to manage, not only upper management’s future problem."},"D":{"type":"review","tag":"c1-o3","text":"Remaining on production for the whole rush leaves breaks, safety, and coordination without oversight."},"E":{"type":"review","tag":"c1-o3","text":"Delaying required breaks transfers the cost of the shortage to employees."}},"family":"c1-o3","acceptable":{}},{"id":"C1Q09","chapter":1,"objective":3,"scenario":"A close friend on your crew has arrived 10–15 minutes late three times this month and asks you to keep today's conversation off the coaching log. How should you handle the discussion?","choices":["Hold the standard private coaching conversation, document the dates and agreed plan, and explain why the same process applies to everyone.","Conduct a candid private conversation today and give your friend one final unlogged chance before starting formal attendance documentation.","Ask another shift supervisor to conduct and document the attendance meeting so your personal friendship does not complicate the process.","Log the late arrivals in the system as required, but keep the conversation brief and informal at the station so it feels less adversarial.","Address the pattern in a general pre-shift huddle reminder about punctuality first so your friend can correct it without a one-on-one log."],"answer":"A","rationale":"Consistent use of the standard coaching and documentation process protects team fairness while giving your friend a clear, respectful opportunity to correct the issue.","feedback":{"A":{"type":"preferred","text":"Consistent use of the standard coaching and documentation process protects team fairness while giving your friend a clear, respectful opportunity to correct the issue.","tag":"aligned"},"B":{"type":"review","tag":"c1-o3","text":"An undocumented exception for a friend makes the attendance process inconsistent."},"C":{"type":"review","tag":"c1-o3","text":"Another supervisor can assist, but avoidance does not remove your responsibility for a fair process."},"D":{"type":"review","tag":"c1-o3","text":"Discussing private attendance matters at a station compromises dignity and candor."},"E":{"type":"review","tag":"c1-o3","text":"A general reminder does not address a known, repeated pattern or create a clear individual plan."}},"family":"c1-o3","acceptable":{}},{"id":"C1Q10","chapter":1,"objective":4,"scenario":"A student forgot an ID badge and asks you to clock them in on their behalf. What is appropriate?","choices":["Enter the hours yourself now and explain the exception at the next meeting.","Ask a trusted coworker to enter the time while you verify the shift later.","Follow the approved timekeeping correction method so actual work time is recorded.","Send the student home immediately even if a correction method is available.","Let them work and quietly adjust the record without identifying the correction."],"answer":"C","rationale":"Accurate pay records require authorized correction, not informal substitution.","feedback":{"A":{"type":"review","tag":"c1-o4","text":"An informal entry by a supervisor may create an inaccurate or unauditable time record."},"B":{"type":"review","tag":"c1-o4","text":"Having a coworker enter time on another person’s behalf creates another unofficial workaround."},"C":{"type":"preferred","text":"Accurate pay records require authorized correction, not informal substitution.","tag":"aligned"},"D":{"type":"review","tag":"c1-o4","text":"Sending the student home may be unnecessary if an approved correction process exists."},"E":{"type":"review","tag":"c1-o4","text":"Quietly editing the entry without a proper record weakens accuracy and accountability."}},"family":"c1-o4","acceptable":{}},{"id":"C1Q11","chapter":1,"objective":4,"scenario":"A manager introduces a legitimate revised closing procedure that employees dislike. How do you lead it?","choices":["Ask the most experienced closer to determine whether the change should apply.","Delay the implementation until employees have stopped complaining about it.","Tell employees the new expectation is entirely management's problem, not yours.","Give the evening crew a gradual trial period for the new procedure while discussing barriers with them.","Explain the change and its purpose, invite questions, and define how it will be checked."],"answer":"E","rationale":"Translating management decisions into practical, understandable action is supervisory work.","feedback":{"A":{"type":"review","tag":"c1-o4","text":"Experienced employees can help implement the procedure, but they cannot unilaterally cancel it."},"B":{"type":"review","tag":"c1-o4","text":"Waiting for dissatisfaction to disappear lets the new requirement go unenforced."},"C":{"type":"review","tag":"c1-o4","text":"Blaming upper management distances you from your job of making the change workable."},"D":{"type":"review","tag":"c1-o4","text":"A trial period may be useful only if managers authorize it; the required procedure still needs to be followed."},"E":{"type":"preferred","text":"Translating management decisions into practical, understandable action is supervisory work.","tag":"aligned"}},"family":"c1-o4","acceptable":{}},{"id":"C1Q12","chapter":1,"objective":4,"scenario":"An employee says your promotion means you can no longer be trusted. Which response helps most?","choices":["Explain how decisions will be made fairly and invite concrete concerns to discuss.","Warn the employee that questioning supervisory trust can become insubordination.","Ask the director to handle any discussion involving relationships with former peers.","Say trust is personal and cannot be addressed through workplace conversations.","Promise to take the team's side whenever employees disagree with management."],"answer":"A","rationale":"Trust is supported by observable consistency and willingness to hear specifics.","feedback":{"A":{"type":"preferred","text":"Trust is supported by observable consistency and willingness to hear specifics.","tag":"aligned"},"B":{"type":"review","tag":"c1-o4","text":"Calling the concern insubordination immediately discourages honest discussion about the transition."},"C":{"type":"review","tag":"c1-o4","text":"The director may help with escalation, but the first respectful conversation is yours to hold."},"D":{"type":"review","tag":"c1-o4","text":"Trust is built through observable workplace decisions, not left outside the workplace."},"E":{"type":"review","tag":"c1-o4","text":"Promising automatic loyalty to one side makes fair decisions harder when interests differ."}},"family":"c1-o4","acceptable":{}},{"id":"C2Q01","chapter":2,"objective":1,"scenario":"Two employees are assigned to the same service station, leaving another uncovered. What comes first?","choices":["Ask the director to rewrite the entire staffing schedule before making changes.","Keep the assignments as written so employees are not confused by a change.","Tell the two employees to decide which one should relocate to the open station.","Cover the empty station yourself while employees continue their original assignments.","Clarify ownership of each station, adjust coverage, and confirm the new plan."],"answer":"E","rationale":"Immediate coverage and explicit ownership resolve both the gap and ambiguity.","feedback":{"A":{"type":"review","tag":"c2-o1","text":"The director may need an update, but the immediate coverage overlap is within normal shift coordination."},"B":{"type":"review","tag":"c2-o1","text":"Keeping a mistaken assignment preserves confusion instead of addressing the uncovered station."},"C":{"type":"review","tag":"c2-o1","text":"Employees can suggest a practical fix, but the supervisor must confirm the decision and coverage."},"D":{"type":"review","tag":"c2-o1","text":"Doing the vacant task yourself leaves the assignment error uncorrected."},"E":{"type":"preferred","text":"Immediate coverage and explicit ownership resolve both the gap and ambiguity.","tag":"aligned"}},"family":"c2-o1","acceptable":{}},{"id":"C2Q02","chapter":2,"objective":1,"scenario":"You delegate the weekly dry-goods inventory count to an experienced cook who has not owned the full report before. What follow-up best balances autonomy and accountability?","choices":["Have the cook count the physical stock on the shelves while you retain responsibility for entering the totals and flagging any variances.","Agree on the completion deadline, show how variances are flagged on the sheet, and schedule a brief check-in before the order is submitted.","Let the cook complete and submit the inventory independently, and review the numbers only if a stockout occurs during next week's shifts.","Spot-check half the storeroom shelves yourself after the cook finishes so you can verify accuracy without interrupting their workflow.","Walk through each storage rack together during the count so you can confirm the numbers line by line on their first full inventory."],"answer":"B","rationale":"Defining the deadline, variance standard, and a planned checkback before submission supports independent execution while protecting operational accuracy.","feedback":{"A":{"type":"review","tag":"c2-o1","text":"You retain most of the task, leaving the experienced cook little opportunity to own the report."},"B":{"type":"preferred","text":"Defining the deadline, variance standard, and a planned checkback before submission supports independent execution while protecting operational accuracy.","tag":"aligned"},"C":{"type":"review","tag":"c2-o1","text":"Waiting until stock runs out is too late to provide useful verification on a new responsibility."},"D":{"type":"review","tag":"c2-o1","text":"Checking secretly after completion may catch errors but offers little transparent coaching."},"E":{"type":"review","tag":"c2-o1","text":"Walking every rack can be useful for a novice, but it unnecessarily removes autonomy from this experienced cook."}},"family":"c2-o1","acceptable":{"E":"Working side by side is reasonable for a first full inventory when the cook actually wants that level of guidance. Fade the supervision as the task becomes familiar."}},{"id":"C2Q03","chapter":2,"objective":1,"scenario":"A new employee misses steps during a long explanation in a noisy kitchen. What would help?","choices":["Require them to find a coworker to interpret instructions before continuing.","Show the task in steps, then ask the worker to demonstrate a key action.","Repeat the complete explanation more loudly without changing the format.","Keep the employee on simple duties rather than teaching the full procedure.","Wait for a quieter shift to provide any training on the procedure."],"answer":"B","rationale":"Demonstration and teach-back check understanding without blaming the learner.","feedback":{"A":{"type":"review","tag":"c2-o1","text":"Relying entirely on another coworker shifts responsibility away from the person giving the instruction."},"B":{"type":"preferred","text":"Demonstration and teach-back check understanding without blaming the learner.","tag":"aligned"},"C":{"type":"review","tag":"c2-o1","text":"Greater volume does not solve a noisy environment or a long, hard-to-follow sequence."},"D":{"type":"review","tag":"c2-o1","text":"Restricting tasks indefinitely prevents the new worker from learning the necessary procedure."},"E":{"type":"review","tag":"c2-o1","text":"A quieter period may help, but the safety-critical steps still require support now."}},"family":"c2-o1","acceptable":{}},{"id":"C2Q04","chapter":2,"objective":2,"scenario":"An allergen-handling process changes just before dinner service. What is the appropriate handoff?","choices":["Give the updated instruction to one experienced person to tell everyone else.","Keep using the old method during dinner and communicate changes afterward.","Pause the task, clarify the change, and check that affected staff understand.","Post the update near the entrance and assume workers will see it in time.","Let each station decide when the new approach can fit its workflow."],"answer":"C","rationale":"Safety-critical updates require direct confirmation before affected work continues.","feedback":{"A":{"type":"review","tag":"c2-o2","text":"A message passed through one person can change or fail to reach someone working with allergens."},"B":{"type":"review","tag":"c2-o2","text":"Using a superseded procedure through dinner leaves an avoidable safety risk in place."},"C":{"type":"preferred","text":"Safety-critical updates require direct confirmation before affected work continues.","tag":"aligned"},"D":{"type":"review","tag":"c2-o2","text":"Posting alone does not confirm that affected employees understood the new rule."},"E":{"type":"review","tag":"c2-o2","text":"Individual stations cannot choose when an essential allergen procedure becomes effective."}},"family":"c2-o2","acceptable":{}},{"id":"C2Q05","chapter":2,"objective":2,"scenario":"Morning and evening shifts argue about missing reordered supplies. What improves the handoff?","choices":["Ask the morning team to accept responsibility because they place the orders.","Give both shifts separate ordering responsibilities and compare their results.","Ask the evening lead to send a short text to morning prep whenever stock runs low during dinner.","Use a group text for issues but leave the inventory procedure unchanged.","Create one shared record of item, order status, next action, and owner."],"answer":"E","rationale":"Durable shared ownership reduces handoff confusion and competing memories.","feedback":{"A":{"type":"review","tag":"c2-o2","text":"Assigning blame based on who places orders does not reveal where the handoff failed."},"B":{"type":"review","tag":"c2-o2","text":"Separate systems can create conflicting records of the same supplies."},"C":{"type":"review","tag":"c2-o2","text":"Texts can help in the moment, but an occasional message does not establish shared status or ownership."},"D":{"type":"review","tag":"c2-o2","text":"A group message without a common record leaves the underlying handoff ambiguity intact."},"E":{"type":"preferred","text":"Durable shared ownership reduces handoff confusion and competing memories.","tag":"aligned"}},"family":"c2-o2","acceptable":{"C":"A timely text can alert the morning team while the issue is current. On its own it does not create a dependable record or assign the next action."}},{"id":"C2Q06","chapter":2,"objective":2,"scenario":"Your note to \"move morning prep earlier tomorrow\" results in one cook arriving 30 minutes early for pastries while the vegetable prep station starts at the old time. How should you fix the direction?","choices":["Ask the morning lead cook to divide the early prep list among the openers each day based on whichever items look lowest in the cooler.","Post the full lunch production forecast on the prep board so the morning crew can judge which items need an earlier start time.","Specify which station items move to the earlier start time, the target completion time, and who will confirm readiness before lunch.","Meet with the vegetable prep cook to review why they did not adjust their start time when the morning schedule note was posted.","Deliver future schedule changes verbally at the end of each shift instead of posting written notes that staff interpret differently."],"answer":"C","rationale":"When an instruction produces conflicting interpretations, the supervisor should clarify the exact deliverable, timing, owner, and verification point before assuming poor effort.","feedback":{"A":{"type":"review","tag":"c2-o2","text":"A daily improvised assignment leaves the original timing and scope ambiguous."},"B":{"type":"review","tag":"c2-o2","text":"A forecast may inform priorities, but it does not specify the revised schedule."},"C":{"type":"preferred","text":"When an instruction produces conflicting interpretations, the supervisor should clarify the exact deliverable, timing, owner, and verification point before assuming poor effort.","tag":"aligned"},"D":{"type":"review","tag":"c2-o2","text":"The original note was unclear, so questioning the cook’s compliance begins with an unfair assumption."},"E":{"type":"review","tag":"c2-o2","text":"Switching to verbal-only directions can create new misunderstandings and no reliable reference."}},"family":"c2-o2","acceptable":{}},{"id":"C2Q07","chapter":2,"objective":3,"scenario":"A worker asks the same procedural question on several shifts. What is your next step?","choices":["Identify the confusing step, create a durable reference, and practice it together.","Refer the employee back to their orientation notes before intervening, to encourage independence.","Answer again each shift without examining why the explanation does not stick.","Praise the worker for asking while keeping the same unclear reference materials.","Move the worker permanently to duties that do not require the procedure."],"answer":"A","rationale":"Repeated questions may indicate a training-design or reference problem.","feedback":{"A":{"type":"preferred","text":"Repeated questions may indicate a training-design or reference problem.","tag":"aligned"},"B":{"type":"review","tag":"c2-o3","text":"Sending the worker back to the same confusing notes may reinforce rather than resolve the problem."},"C":{"type":"review","tag":"c2-o3","text":"Repeated explanations may help briefly, but the repeated question signals an underlying learning gap."},"D":{"type":"review","tag":"c2-o3","text":"Praise is encouraging, but it does not repair the instruction or reference material."},"E":{"type":"review","tag":"c2-o3","text":"Permanent reassignment avoids teaching a skill the employee may be able to learn."}},"family":"c2-o3","acceptable":{}},{"id":"C2Q08","chapter":2,"objective":3,"scenario":"You need to select a shift lead for Saturday's alumni catering event. A close friend is eager for the role, while a quieter coworker has stronger prep and allergen-control experience. What is the fairest approach?","choices":["Give your friend the lead role this weekend to reward their initiative, while assigning the experienced coworker to back them up on safety.","Coordinate the alumni catering event yourself this Saturday so neither employee feels passed over while you establish formal lead criteria.","Rotate the special-event lead assignment strictly by hiring seniority so selection decisions never appear personal or subjective.","Select the more prepared coworker using job-related criteria, and offer your friend a specific sub-task to build event-planning experience.","Appoint both employees as co-leads for the catering event so they can share the opportunity and divide the stations between themselves."],"answer":"D","rationale":"Making selection decisions on transparent readiness criteria, while giving the other employee a concrete way to build the missing skills, supports both operational safety and developmental fairness.","feedback":{"A":{"type":"review","tag":"c2-o3","text":"Interest deserves encouragement, but it cannot replace the event’s safety and readiness requirements."},"B":{"type":"review","tag":"c2-o3","text":"Taking over personally delays developing a qualified employee who could lead well."},"C":{"type":"review","tag":"c2-o3","text":"Seniority alone does not establish the specific capabilities this event needs."},"D":{"type":"preferred","text":"Making selection decisions on transparent readiness criteria, while giving the other employee a concrete way to build the missing skills, supports both operational safety and developmental fairness.","tag":"aligned"},"E":{"type":"review","tag":"c2-o3","text":"Co-leading might be useful when responsibilities are clear, but it can also obscure who owns allergen controls."}},"family":"c2-o3","acceptable":{"E":"Co-leadership can be developmental if both people are qualified, safety accountability is clear, and responsibilities are explicitly divided. Do not use it merely to avoid a difficult selection."}},{"id":"C2Q09","chapter":2,"objective":3,"scenario":"In the dishroom, employees hear different versions of a new cleaning sequence. What helps?","choices":["Wait until the dishroom closes, then describe the corrected sequence verbally.","Repeat the revised sequence louder during the busiest part of the shift.","Post a short visual sequence, demonstrate it, and confirm critical steps.","Let each worker use a preferred order if the final dishes look clean.","Ask experienced workers to correct the sequence whenever they notice an issue."],"answer":"C","rationale":"A visible shared sequence plus demonstration is more reliable in noise.","feedback":{"A":{"type":"review","tag":"c2-o3","text":"Correcting everyone later leaves inconsistent procedures in use throughout the current shift."},"B":{"type":"review","tag":"c2-o3","text":"Repeating instructions louder does not ensure that each employee understands the steps."},"C":{"type":"preferred","text":"A visible shared sequence plus demonstration is more reliable in noise.","tag":"aligned"},"D":{"type":"review","tag":"c2-o3","text":"A clean-looking dish does not establish the required sanitation procedure was followed."},"E":{"type":"review","tag":"c2-o3","text":"Relying on informal corrections makes the process depend on who notices an error."}},"family":"c2-o3","acceptable":{}},{"id":"C2Q10","chapter":2,"objective":4,"scenario":"Catering beverages are omitted because the checklist does not name an owner. How should you revise it?","choices":["Keep responsibility shared so any available team member can complete the beverages.","Have the supervisor personally pack beverages for every catering order from now on.","Ask the catering driver to double-check every cart at loading, while leaving kitchen prep roles unchanged.","Assign a beverage packer and a final verifier with an explicit check time.","Ask the fastest packer to monitor every supply category for the team."],"answer":"D","rationale":"Shared outcomes still need clear responsibility and verification.","feedback":{"A":{"type":"review","tag":"c2-o4","text":"When everyone owns a task in theory, nobody may notice that it remains undone."},"B":{"type":"review","tag":"c2-o4","text":"Packing everything yourself turns the supervisor into the permanent workaround."},"C":{"type":"review","tag":"c2-o4","text":"A final driver check can catch omissions, but preparation still needs a clear owner."},"D":{"type":"preferred","text":"Shared outcomes still need clear responsibility and verification.","tag":"aligned"},"E":{"type":"review","tag":"c2-o4","text":"Adding oversight to the fastest employee without defined ownership can overload that worker."}},"family":"c2-o4","acceptable":{}},{"id":"C2Q11","chapter":2,"objective":4,"scenario":"One dependable employee always receives the least desirable cleanup. What is better?","choices":["Continue the assignment because the employee has demonstrated reliable performance.","Perform the cleanup yourself to avoid asking anyone to do undesirable work.","Ask the employee whether they mind, then leave the arrangement permanent.","Give every unpleasant closing task to new employees as part of orientation.","Rotate work using transparent criteria and verify that people are trained."],"answer":"E","rationale":"Reliability should not become a hidden penalty.","feedback":{"A":{"type":"review","tag":"c2-o4","text":"Dependability should not become a permanent penalty of less desirable assignments."},"B":{"type":"review","tag":"c2-o4","text":"Doing the cleanup yourself conceals the unfair distribution instead of correcting it."},"C":{"type":"review","tag":"c2-o4","text":"Even a willing employee deserves a sustainable and transparent workload arrangement."},"D":{"type":"review","tag":"c2-o4","text":"Assigning unpopular tasks only to new employees creates a different inequity."},"E":{"type":"preferred","text":"Reliability should not become a hidden penalty.","tag":"aligned"}},"family":"c2-o4","acceptable":{}},{"id":"C2Q12","chapter":2,"objective":4,"scenario":"A freezer alarm was mentioned verbally but left out of the handoff notes. What should happen?","choices":["Record the alarm, actions taken, current status, and owner of the next check.","Send a group message so the evening crew can decide what to document.","Assume maintenance will tell the next shift if the alarm needs attention.","Inspect all freezers yourself every morning without changing the handoff system.","Ask the outgoing shift to be more careful with verbal reports next time."],"answer":"A","rationale":"A safety handoff needs durable facts, status, and ownership.","feedback":{"A":{"type":"preferred","text":"A safety handoff needs durable facts, status, and ownership.","tag":"aligned"},"B":{"type":"review","tag":"c2-o4","text":"A group message without a documented state and owner may leave the problem unresolved."},"C":{"type":"review","tag":"c2-o4","text":"Maintenance may be involved, but the next shift still needs an accurate operational handoff."},"D":{"type":"review","tag":"c2-o4","text":"Personal checking does not replace a durable procedure that works when you are absent."},"E":{"type":"review","tag":"c2-o4","text":"A reminder to be careful does not give the next shift the alarm’s status or owner."}},"family":"c2-o4","acceptable":{}},{"id":"C3Q01","chapter":3,"objective":1,"scenario":"A refrigerator reads warmer than usual during prep. What is the first supervisory action?","choices":["Move only the expensive ingredients to another refrigerator and keep serving.","Lower the thermostat setting and see whether the display improves by lunch.","Check temperatures, protect affected food, and use the required escalation.","Watch the reading for another hour because equipment displays often fluctuate.","Continue service while asking maintenance to inspect the refrigerator after closing."],"answer":"C","rationale":"Potential food safety risk requires verification and approved controls.","feedback":{"A":{"type":"review","tag":"c3-o1","text":"Prioritizing ingredients by value ignores whether other exposed food is safe."},"B":{"type":"review","tag":"c3-o1","text":"Changing a thermostat is not evidence that food has remained within safe limits."},"C":{"type":"preferred","text":"Potential food safety risk requires verification and approved controls.","tag":"aligned"},"D":{"type":"review","tag":"c3-o1","text":"A fluctuating display still requires timely verification when food safety may be affected."},"E":{"type":"review","tag":"c3-o1","text":"Scheduling maintenance later does not protect potentially unsafe product now."}},"family":"c3-o1","acceptable":{}},{"id":"C3Q02","chapter":3,"objective":1,"scenario":"A ticket printer fails during the lunch rush, and stations blame one another. What do you do?","choices":["Tell the service team that missing orders are exclusively the kitchen's responsibility.","Wait for a manager to return before using a temporary order-transfer process.","Have all servers call orders directly to cooks until the printer works again.","Personally repeat every ticket to every station for the duration of lunch.","Assign a coordinator for backup orders and request repair of the printer."],"answer":"E","rationale":"A coordinated temporary process reduces contradictory orders and confusion.","feedback":{"A":{"type":"review","tag":"c3-o1","text":"Blaming the kitchen without a functioning order channel does nothing to restore service."},"B":{"type":"review","tag":"c3-o1","text":"Waiting for a manager leaves the team without a controlled temporary workflow."},"C":{"type":"review","tag":"c3-o1","text":"Multiple shouted orders may lead to duplicates and missing tickets."},"D":{"type":"review","tag":"c3-o1","text":"Repeating every ticket yourself makes one person the bottleneck and leaves other duties uncovered."},"E":{"type":"preferred","text":"A coordinated temporary process reduces contradictory orders and confusion.","tag":"aligned"}},"family":"c3-o1","acceptable":{"C":"Verbal calls can help temporarily if one qualified person tracks orders, confirmations, and allergens. Without coordinated ownership, several cooks may receive inconsistent requests."}},{"id":"C3Q03","chapter":3,"objective":1,"scenario":"An employee calls off ten minutes before a packed lunch service. What should you prioritize?","choices":["Adjust the menu priorities and move qualified people to the busiest areas.","Keep the planned workload until guests visibly notice a service decline.","Cover the absent worker's station yourself for the entire rush period.","Postpone required breaks while keeping all service commitments unchanged.","Ask everyone to work faster without changing the service plan or assignments."],"answer":"A","rationale":"Capacity should be adjusted explicitly, not hidden through overload.","feedback":{"A":{"type":"preferred","text":"Capacity should be adjusted explicitly, not hidden through overload.","tag":"aligned"},"B":{"type":"review","tag":"c3-o1","text":"Waiting for customers to notice a breakdown means allowing preventable service problems."},"C":{"type":"review","tag":"c3-o1","text":"Taking over one station for the whole rush leaves no one managing the revised capacity."},"D":{"type":"review","tag":"c3-o1","text":"Skipping required breaks is not a legitimate substitute for reorganizing work."},"E":{"type":"review","tag":"c3-o1","text":"Telling everyone to work faster ignores an actual reduction in staffing capacity."}},"family":"c3-o1","acceptable":{}},{"id":"C3Q04","chapter":3,"objective":2,"scenario":"Opening prep is late repeatedly, but a different item is delayed each time. What next?","choices":["Remind everyone to improve teamwork before deciding what else to change.","Add an extra worker to each prep station without looking at the workflow.","Complete the missed prep yourself so the opening team sees the expected pace.","Observe the task sequence, available tools, and recurring bottlenecks first.","Set a firmer prep deadline for every opening shift so the slowest station has a clearer target."],"answer":"D","rationale":"Variable delays suggest examining workflow before choosing individual accountability.","feedback":{"A":{"type":"review","tag":"c3-o2","text":"A general teamwork reminder does not identify the reason different tasks become late."},"B":{"type":"review","tag":"c3-o2","text":"Adding staff everywhere is costly and may miss the shared bottleneck."},"C":{"type":"review","tag":"c3-o2","text":"Doing the work yourself hides the cause and prevents a lasting correction."},"D":{"type":"preferred","text":"Variable delays suggest examining workflow before choosing individual accountability.","tag":"aligned"},"E":{"type":"review","tag":"c3-o2","text":"A stricter deadline cannot remove a workflow blockage that you have not identified."}},"family":"c3-o2","acceptable":{}},{"id":"C3Q05","chapter":3,"objective":2,"scenario":"Food waste rises and employees offer conflicting explanations. What is useful?","choices":["Tell the production cook to reduce waste because that station owns portions.","Choose the explanation endorsed by most of the experienced employees.","Reduce every portion size immediately and see whether guests complain.","Check records against actual production and test the likely source of waste.","Wait for the monthly budget meeting before making any operational changes."],"answer":"D","rationale":"Evidence helps distinguish forecasting, portioning, timing, and other causes.","feedback":{"A":{"type":"review","tag":"c3-o2","text":"A workstation may contribute to waste, but the data must establish the cause."},"B":{"type":"review","tag":"c3-o2","text":"Majority opinion is not a substitute for production, portion, and demand records."},"C":{"type":"review","tag":"c3-o2","text":"Smaller portions could create new service problems without reducing the true source of waste."},"D":{"type":"preferred","text":"Evidence helps distinguish forecasting, portioning, timing, and other causes.","tag":"aligned"},"E":{"type":"review","tag":"c3-o2","text":"Waiting for the budget cycle delays an investigation that can begin during ordinary operations."}},"family":"c3-o2","acceptable":{}},{"id":"C3Q06","chapter":3,"objective":2,"scenario":"The dish machine leaves residue and the approved chemical supply is running low. What now?","choices":["Verify sanitation and follow approved alternative procedures or stop service.","Run each rack through the machine twice without checking whether it is sanitized.","Continue operating until the rush ends because replacing supplies takes time.","Serve items that look clean, then rewash only dishes with visible residue.","Ask an experienced worker to change chemical settings outside posted procedures."],"answer":"A","rationale":"Sanitation requires verified controls, not appearance or improvised chemistry.","feedback":{"A":{"type":"preferred","text":"Sanitation requires verified controls, not appearance or improvised chemistry.","tag":"aligned"},"B":{"type":"review","tag":"c3-o2","text":"Extra wash cycles do not prove that a chemical or temperature requirement is met."},"C":{"type":"review","tag":"c3-o2","text":"Continuing operation while controls are failing can put unsafe tableware into service."},"D":{"type":"review","tag":"c3-o2","text":"Visible cleanliness is not a substitute for verified sanitizing."},"E":{"type":"review","tag":"c3-o2","text":"Unapproved chemical changes introduce a hazard rather than providing a controlled fix."}},"family":"c3-o2","acceptable":{}},{"id":"C3Q07","chapter":3,"objective":3,"scenario":"Multiple closers miss the same poorly defined sanitation area. What is the best response?","choices":["Write up the next employee who fails so the instruction is taken seriously.","Specify the surfaces, show the required standard, and verify at closing.","Perform the missed work yourself after everyone leaves each evening.","Assign the area permanently to the one employee who already cleans it well.","Add a general reminder to work carefully without changing the checklist."],"answer":"B","rationale":"Repeated errors across people may reveal a clarity problem.","feedback":{"A":{"type":"review","tag":"c3-o3","text":"Discipline before clarifying the task could punish a misunderstanding shared by many workers."},"B":{"type":"preferred","text":"Repeated errors across people may reveal a clarity problem.","tag":"aligned"},"C":{"type":"review","tag":"c3-o3","text":"Completing the task yourself keeps the standard ambiguous for everyone else."},"D":{"type":"review","tag":"c3-o3","text":"Assigning every problem area to the best cleaner is not a sustainable system."},"E":{"type":"review","tag":"c3-o3","text":"A vague reminder leaves the same unclear definition of a finished task."}},"family":"c3-o3","acceptable":{}},{"id":"C3Q08","chapter":3,"objective":3,"scenario":"A guest may have received a meal containing an ingredient they identified as an allergen. What next?","choices":["Reassure the guest that recipes are usually accurate and keep service moving.","Wait until the meal period ends to investigate how the order was prepared.","Pause affected food preparation and follow the allergy-response procedure.","Ask the server why the order was mishandled before checking the food involved.","Refund the purchase and close the issue unless the guest files a complaint."],"answer":"C","rationale":"Possible allergen exposure warrants prompt safety response and factual checks.","feedback":{"A":{"type":"review","tag":"c3-o3","text":"General confidence in recipes cannot answer whether this guest was exposed to an allergen."},"B":{"type":"review","tag":"c3-o3","text":"Delaying action until after service puts the timetable ahead of a possible safety issue."},"C":{"type":"preferred","text":"Possible allergen exposure warrants prompt safety response and factual checks.","tag":"aligned"},"D":{"type":"review","tag":"c3-o3","text":"Finding someone to blame is secondary to making the guest and preparation process safe."},"E":{"type":"review","tag":"c3-o3","text":"A refund does not replace a timely response to a potential allergen exposure."}},"family":"c3-o3","acceptable":{}},{"id":"C3Q09","chapter":3,"objective":3,"scenario":"An ingredient is unavailable, and the closest substitute has a different allergen profile. What works?","choices":["Remove the ingredient without notifying anyone because the result is similar.","Let a veteran cook decide privately whether the substitute is equivalent.","Use the substitute in small amounts so the recipe change is less noticeable.","Stretch the original ingredient with a related product until the order arrives.","Follow approved substitution rules and update ingredient communication."],"answer":"E","rationale":"Ingredient changes can alter safety and labeling, not just flavor.","feedback":{"A":{"type":"review","tag":"c3-o3","text":"Removing an ingredient without disclosure can change what a guest expects or needs to avoid."},"B":{"type":"review","tag":"c3-o3","text":"An experienced cook's opinion cannot replace authorized substitution and labeling controls."},"C":{"type":"review","tag":"c3-o3","text":"A small quantity of a problematic allergen is still significant."},"D":{"type":"review","tag":"c3-o3","text":"Stretching supplies with another ingredient creates an unapproved recipe and disclosure problem."},"E":{"type":"preferred","text":"Ingredient changes can alter safety and labeling, not just flavor.","tag":"aligned"}},"family":"c3-o3","acceptable":{}},{"id":"C3Q10","chapter":3,"objective":4,"scenario":"The sandwich line remains slow even with motivated, experienced staff. Its layout causes extra steps. What next?","choices":["Lower the service target without testing whether the layout can change.","Add another employee to the narrow station despite limited working space.","Tell workers to move faster and review individual productivity next week.","Appoint the fastest worker to direct every sandwich assembled.","Test a safer station layout and compare service flow before finalizing it."],"answer":"E","rationale":"An observed physical bottleneck suggests a process intervention.","feedback":{"A":{"type":"review","tag":"c3-o4","text":"Lowering expectations before investigating the layout may accept a fixable bottleneck."},"B":{"type":"review","tag":"c3-o4","text":"More people in an already narrow station can increase congestion and risk."},"C":{"type":"review","tag":"c3-o4","text":"Telling experienced staff to hurry ignores the steps the layout forces them to take."},"D":{"type":"review","tag":"c3-o4","text":"One worker directing every sandwich adds coordination overhead rather than improving the station."},"E":{"type":"preferred","text":"An observed physical bottleneck suggests a process intervention.","tag":"aligned"}},"family":"c3-o4","acceptable":{}},{"id":"C3Q11","chapter":3,"objective":4,"scenario":"During afternoon prep, a student worker reports that they accidentally used a deep pan instead of a shallow pan for cooling soup, which may have slowed cooling below food-safety limits. What should you do?","choices":["Transfer the soup into shallow pans in the walk-in cooler right away so the batch can finish cooling before dinner service begins.","Discard the batch without logging the waste incident so the student worker is not penalized for reporting the mistake honestly.","Document a formal food-safety violation in the worker's file to reinforce that cooling procedures must be followed on every batch.","Reassign soup cooling to a full-time cook for the rest of the month while the student worker shadows other prep tasks.","Check the soup temperature against cooling standards, pull any unsafe product, thank the worker for speaking up, and review pan selection."],"answer":"E","rationale":"When an employee self-reports an error, the supervisor must first verify food safety and protect guests, while reinforcing psychological safety and targeted skill correction.","feedback":{"A":{"type":"review","tag":"c3-o4","text":"Moving the soup to shallow pans now does not establish that its earlier temperature history is safe."},"B":{"type":"review","tag":"c3-o4","text":"Quietly discarding product may protect guests, but it suppresses essential documentation and learning."},"C":{"type":"review","tag":"c3-o4","text":"Formal discipline before checking safety and understanding the mistake discourages future reporting."},"D":{"type":"review","tag":"c3-o4","text":"Removing the student from the task may be premature without checking the failure and providing coaching."},"E":{"type":"preferred","text":"When an employee self-reports an error, the supervisor must first verify food safety and protect guests, while reinforcing psychological safety and targeted skill correction.","tag":"aligned"}},"family":"c3-o4","acceptable":{}},{"id":"C3Q12","chapter":3,"objective":4,"scenario":"An employee almost slips beside a leaking sink but is not hurt. What response is useful?","choices":["Warn the employee to pay closer attention whenever they enter that area.","Move the employee to another station and leave the leak for maintenance.","Give the crew a verbal reminder to be cautious without recording the event.","Mop the floor and return to normal work once the visible water is gone.","Control the hazard, report the near miss, and verify a lasting correction."],"answer":"E","rationale":"Near misses reveal hazards even when an injury does not occur.","feedback":{"A":{"type":"review","tag":"c3-o4","text":"The leaking sink, not only employee attentiveness, creates a repeatable hazard."},"B":{"type":"review","tag":"c3-o4","text":"Moving one worker does not remove the water hazard for everyone else."},"C":{"type":"review","tag":"c3-o4","text":"A verbal reminder without reporting and correction leaves the hazard active."},"D":{"type":"review","tag":"c3-o4","text":"Mopping removes visible water but not the leak that caused it."},"E":{"type":"preferred","text":"Near misses reveal hazards even when an injury does not occur.","tag":"aligned"}},"family":"c3-o4","acceptable":{}},{"id":"C4Q01","chapter":4,"objective":1,"scenario":"A high performer repeatedly omits a required temperature log. What should you do?","choices":["Avoid criticism because this employee's overall results help the team substantially.","Describe the missed logs, explain the standard, and confirm a workable follow-up.","Ask another worker to fill in the log so service is not slowed down.","Allow a limited exception because the cook has demonstrated strong judgment.","Wait for a documented safety incident before raising the missed records."],"answer":"B","rationale":"Strong performance does not remove safety-critical responsibilities.","feedback":{"A":{"type":"review","tag":"c4-o1","text":"Excellent performance does not cancel a required record or its safety purpose."},"B":{"type":"preferred","text":"Strong performance does not remove safety-critical responsibilities.","tag":"aligned"},"C":{"type":"review","tag":"c4-o1","text":"Asking someone else to complete another worker’s log risks inaccurate records."},"D":{"type":"review","tag":"c4-o1","text":"A private exception weakens a safety standard that should apply consistently."},"E":{"type":"review","tag":"c4-o1","text":"Waiting for harm before coaching ignores repeated warning signs."}},"family":"c4-o1","acceptable":{}},{"id":"C4Q02","chapter":4,"objective":1,"scenario":"A new worker is accurate but slower than the service standard and improving. How should you coach?","choices":["Tell them to be patient and assume their speed will increase on its own.","Compare their output publicly with the most experienced worker on the station.","Agree on a realistic speed goal without sacrificing accuracy or safety.","Reduce required portion checks to help the employee achieve the speed target.","Transfer the employee permanently to lower-volume tasks rather than coaching."],"answer":"C","rationale":"Coaching should connect an observable skill to practice and follow-up.","feedback":{"A":{"type":"review","tag":"c4-o1","text":"Patience matters, but progress is easier when the learner knows what to practice next."},"B":{"type":"review","tag":"c4-o1","text":"Public comparisons may embarrass a developing employee and reduce willingness to ask for help."},"C":{"type":"preferred","text":"Coaching should connect an observable skill to practice and follow-up.","tag":"aligned"},"D":{"type":"review","tag":"c4-o1","text":"Omitting quality checks to increase speed sacrifices a required standard."},"E":{"type":"review","tag":"c4-o1","text":"Moving the worker away permanently removes the chance to build the missing skill."}},"family":"c4-o1","acceptable":{}},{"id":"C4Q03","chapter":4,"objective":1,"scenario":"A veteran frequently interrupts new workers while they are speaking to guests. What works?","choices":["Tell new workers to speak more firmly so the veteran does not interrupt.","Reassign the veteran immediately without discussing the behavior first.","Correct the veteran in front of guests to show support for new employees.","Praise the veteran for preventing delays even when the interruption is unnecessary.","Privately describe the interruptions, their effect, and the expected alternative."],"answer":"E","rationale":"Behavior-focused feedback preserves accountability and dignity.","feedback":{"A":{"type":"review","tag":"c4-o1","text":"The veteran, not only the new worker, has a responsibility to stop interrupting."},"B":{"type":"review","tag":"c4-o1","text":"Immediate reassignment may be disproportionate before clarifying expectations and facts."},"C":{"type":"review","tag":"c4-o1","text":"A public correction in front of guests repeats the disrespect you are trying to stop."},"D":{"type":"review","tag":"c4-o1","text":"Praising the behavior reinforces interruptions rather than teaching a workable alternative."},"E":{"type":"preferred","text":"Behavior-focused feedback preserves accountability and dignity.","tag":"aligned"}},"family":"c4-o1","acceptable":{}},{"id":"C4Q04","chapter":4,"objective":2,"scenario":"A student arrives late because a class ends close to shift start. What is appropriate?","choices":["Ask other employees to cover the first minutes indefinitely without discussion.","Warn the student that work must always take precedence over class scheduling.","Reduce the student's hours without explaining the reason or available options.","Review the actual scheduling conflict and use the standard attendance process.","Ignore lateness because the employee is a student and needs flexibility."],"answer":"D","rationale":"Establish the pattern and use a transparent scheduling process.","feedback":{"A":{"type":"review","tag":"c4-o2","text":"Unspoken indefinite coverage asks other workers to absorb an unresolved schedule conflict."},"B":{"type":"review","tag":"c4-o2","text":"A student’s class schedule is a legitimate factor to examine under policy."},"C":{"type":"review","tag":"c4-o2","text":"Cutting hours without discussion bypasses the chance to address the underlying conflict."},"D":{"type":"preferred","text":"Establish the pattern and use a transparent scheduling process.","tag":"aligned"},"E":{"type":"review","tag":"c4-o2","text":"A blanket exception may seem kind but does not establish a workable coverage plan."}},"family":"c4-o2","acceptable":{}},{"id":"C4Q05","chapter":4,"objective":2,"scenario":"During a rush, a cook plates an order incorrectly in front of colleagues. What next?","choices":["Wait until service ends even if the incorrect plate may reach a guest.","Turn the incident into a public demonstration of proper plating technique.","Ask a peer to correct the mistake while you handle other supervisory duties.","Correct the plate now and discuss any repeated pattern privately afterward.","Take over the cook's station to prevent another visible mistake."],"answer":"D","rationale":"Immediate service quality and respectful coaching are compatible.","feedback":{"A":{"type":"review","tag":"c4-o2","text":"If a wrong plate may reach a guest, waiting until later risks an immediate service error."},"B":{"type":"review","tag":"c4-o2","text":"A public lesson can turn a correctable error into avoidable embarrassment."},"C":{"type":"review","tag":"c4-o2","text":"A peer may assist, but the supervisor should ensure the incorrect order is contained promptly."},"D":{"type":"preferred","text":"Immediate service quality and respectful coaching are compatible.","tag":"aligned"},"E":{"type":"review","tag":"c4-o2","text":"Taking over entirely prevents the cook from learning the corrected process."}},"family":"c4-o2","acceptable":{"C":"A trained coworker can correct the plate immediately while you maintain shift coverage. You still need to ensure the correction happens and privately follow up on any pattern."}},{"id":"C4Q06","chapter":4,"objective":2,"scenario":"While you are privately reviewing two incomplete station handoffs from this week, the employee becomes defensive and says the incoming shift is exaggerating to make them look bad. How should you proceed?","choices":["Anchor the discussion in what you directly observed on the station, ask what obstacles occurred at close, and agree on tonight's checkback.","Bring the incoming shift lead into the office for a brief three-way conversation so both employees can clarify what was left unfinished.","Pause the coaching meeting for today so tensions can cool, and observe the station silently for another week before revisiting the topic.","Explain that blaming the next shift shows a lack of accountability and restate that the closing checklist must be 100% complete tonight.","Shift the focus away from the past two shifts and ask the employee to write down their own goals for improving station handoffs next week."],"answer":"A","rationale":"Returning to firsthand observable evidence and inviting operational context keeps the conversation grounded in solvable work behaviors rather than interpersonal accusations.","feedback":{"A":{"type":"preferred","text":"Returning to firsthand observable evidence and inviting operational context keeps the conversation grounded in solvable work behaviors rather than interpersonal accusations.","tag":"aligned"},"B":{"type":"review","tag":"c4-o2","text":"A three-way confrontation before separating facts can increase defensiveness and expose private coaching."},"C":{"type":"review","tag":"c4-o2","text":"Cooling off can help, but another week of missed handoffs is not a clear corrective plan."},"D":{"type":"review","tag":"c4-o2","text":"Calling the concern blame before hearing the facts may entrench the employee’s defensiveness."},"E":{"type":"review","tag":"c4-o2","text":"Goals for next week cannot replace a response to the documented missed tasks today."}},"family":"c4-o2","acceptable":{"B":"A joint discussion can reveal the handoff breakdown if privacy, timing, and both employees’ readiness are addressed. Start with observed facts rather than staging a confrontation."}},{"id":"C4Q07","chapter":4,"objective":3,"scenario":"An employee has sustained better closing performance for three weeks. What feedback helps?","choices":["Say nothing because successful completion is already part of their job.","Assign the employee the easiest station next week without explanation.","Name the specific improvement and explain how it helped the shift.","Thank the whole closing crew at the next huddle for improving the handoff routine.","Say they have a great attitude without naming what actually changed."],"answer":"C","rationale":"Specific recognition reinforces observable effective behavior.","feedback":{"A":{"type":"review","tag":"c4-o3","text":"Silence misses an opportunity to reinforce a specific new habit."},"B":{"type":"review","tag":"c4-o3","text":"A favorable assignment may be appreciated, but it does not tell the employee which behavior improved."},"C":{"type":"preferred","text":"Specific recognition reinforces observable effective behavior.","tag":"aligned"},"D":{"type":"review","tag":"c4-o3","text":"Group recognition is useful, but it misses the chance to reinforce this employee’s specific change."},"E":{"type":"review","tag":"c4-o3","text":"Generic praise does not help the employee understand which behavior mattered."}},"family":"c4-o3","acceptable":{"D":"Recognizing the whole crew can reinforce better handoffs. The employee whose performance improved also deserves specific, individual feedback."}},{"id":"C4Q08","chapter":4,"objective":3,"scenario":"Employees know the logging rule but keep missing it during the actual workflow. What next?","choices":["Assume they do not care because everyone passed the initial knowledge quiz.","Move responsibility to the worker who completes the log most consistently.","Require everyone to repeat identical training without observing their tasks.","Begin formal discipline before checking whether the process supports compliance.","Observe workflow interruptions and coach or redesign the point-of-work routine."],"answer":"E","rationale":"Knowing a rule and applying it in context are different performance problems.","feedback":{"A":{"type":"review","tag":"c4-o3","text":"Knowing the rule on a quiz does not establish that the workflow supports following it."},"B":{"type":"review","tag":"c4-o3","text":"Moving all logging to one reliable worker hides the design problem and concentrates risk."},"C":{"type":"review","tag":"c4-o3","text":"Repeating the same lesson without examining real conditions may not change behavior."},"D":{"type":"review","tag":"c4-o3","text":"Discipline before checking for task conflicts risks misdiagnosing the pattern."},"E":{"type":"preferred","text":"Knowing a rule and applying it in context are different performance problems.","tag":"aligned"}},"family":"c4-o3","acceptable":{}},{"id":"C4Q09","chapter":4,"objective":3,"scenario":"You just finished coaching a cashier who left the register drawer unlocked twice during break handoffs. Which coaching note is most appropriate for your supervisory log?","choices":["\"Kept today's coaching informal to build rapport; will create a written log entry only if a third unlocked-drawer incident occurs this month.\"","\"Reviewed unlocked cash drawer on 11/2 and 11/4; demonstrated key-turn checkback with relief cashier; will verify at break handoffs this week.\"","\"Coached employee on cash-handling carelessness; employee seemed distracted by midterms but promised to pay closer attention before breaks.\"","\"Met with cashier regarding cash-security policy; reminded them of potential disciplinary consequences if the drawer is left unlocked again.\"","\"Discussed break-handoff procedures with cashier; both of us signed the standard register policy sheet to confirm training was completed.\""],"answer":"B","rationale":"Effective supervisory documentation records specific dates, observable behaviors, the support or practice provided, and the scheduled follow-up check without speculating on personality or motives.","feedback":{"A":{"type":"review","tag":"c4-o3","text":"An informal conversation is not a substitute for the required record of repeated cash-security incidents."},"B":{"type":"preferred","text":"Effective supervisory documentation records specific dates, observable behaviors, the support or practice provided, and the scheduled follow-up check without speculating on personality or motives.","tag":"aligned"},"C":{"type":"review","tag":"c4-o3","text":"Calling the employee careless replaces observable facts with a personality judgment."},"D":{"type":"review","tag":"c4-o3","text":"A warning may be relevant, but the note omits specific dates and a way to verify improvement."},"E":{"type":"review","tag":"c4-o3","text":"Signing a policy does not record what the two incidents were or how follow-up will occur."}},"family":"c4-o3","acceptable":{}},{"id":"C4Q10","chapter":4,"objective":4,"scenario":"Production declines and colleagues say a worker lacks motivation, but equipment has failed before. What next?","choices":["Ask about the problem and observe the task before deciding why it happens.","Issue a motivation warning first so expectations are unmistakable.","Assume every shortfall is an equipment problem and stop reviewing performance.","Replace the employee without evaluating whether tools are affecting production.","Ask peers to monitor the worker privately and report suspected disengagement."],"answer":"A","rationale":"Good diagnosis precedes an intervention that matches the cause.","feedback":{"A":{"type":"preferred","text":"Good diagnosis precedes an intervention that matches the cause.","tag":"aligned"},"B":{"type":"review","tag":"c4-o4","text":"A motivation warning assumes a cause without examining the tools or workflow."},"C":{"type":"review","tag":"c4-o4","text":"Assuming equipment always explains poor performance is as unhelpful as assuming it never does."},"D":{"type":"review","tag":"c4-o4","text":"Replacement before investigation risks repeating the same problem with another worker."},"E":{"type":"review","tag":"c4-o4","text":"Secret peer surveillance damages trust and does not establish reliable evidence."}},"family":"c4-o4","acceptable":{}},{"id":"C4Q11","chapter":4,"objective":4,"scenario":"A top cook rejects standardized portions because their method is faster. What should you do?","choices":["Encourage everyone to copy the cook's method because output is high.","Permit a private exception until customer complaints begin to appear.","Recognize the cook's speed while coaching the required portion standard.","Delay any discussion while production numbers remain above average.","Move the cook away from guest-facing production to avoid further disagreements."],"answer":"C","rationale":"Quality and consistency standards still apply to strong performers.","feedback":{"A":{"type":"review","tag":"c4-o4","text":"High output is useful but does not justify ignoring required portions."},"B":{"type":"review","tag":"c4-o4","text":"Private exceptions make the standard inconsistent and hard to enforce."},"C":{"type":"preferred","text":"Quality and consistency standards still apply to strong performers.","tag":"aligned"},"D":{"type":"review","tag":"c4-o4","text":"Strong production today does not erase the impact of inconsistent portioning."},"E":{"type":"review","tag":"c4-o4","text":"Reassignment may be necessary in some cases, but first clarify and coach the required standard."}},"family":"c4-o4","acceptable":{}},{"id":"C4Q12","chapter":4,"objective":4,"scenario":"A coaching agreement worked for a week, but the issue has returned. How do you follow up?","choices":["Review the plan, ask what changed, and adjust support or accountability.","Move the entire responsibility to a different employee for several weeks.","Wait for the problem to become severe enough for a formal warning.","Repeat your original coaching speech without reviewing what happened afterward.","Ask coworkers to share criticisms so you have more material for the meeting."],"answer":"A","rationale":"Follow-up checks whether a plan worked, not just whether it was delivered.","feedback":{"A":{"type":"preferred","text":"Follow-up checks whether a plan worked, not just whether it was delivered.","tag":"aligned"},"B":{"type":"review","tag":"c4-o4","text":"Moving the task avoids learning why the improvement disappeared."},"C":{"type":"review","tag":"c4-o4","text":"Waiting for escalation sacrifices a chance to repair the plan now."},"D":{"type":"review","tag":"c4-o4","text":"Repeating the same speech does not examine what changed after the initial improvement."},"E":{"type":"review","tag":"c4-o4","text":"Collecting coworker criticism may increase hostility instead of identifying the relevant behavior."}},"family":"c4-o4","acceptable":{}},{"id":"C5Q01","chapter":5,"objective":1,"scenario":"At 12:15 PM during peak lunch, the grill cook and the expeditor begin arguing loudly over whether a missing allergen-free bun was called, and ticket times are climbing. What is your best first move?","choices":["Step into the expeditor position yourself for the rest of the lunch rush so the two employees do not have to communicate directly.","Remind both workers that arguing in front of guests violates workplace conduct rules and warn them that further remarks will result in write-ups.","Call the immediate remake needed to serve the waiting guest, refocus both workers on current tickets, and review the call-back process after rush.","Pull both employees off the line into the hallway for three minutes right now so they can resolve the miscommunication before tempers worsen.","Check the printed ticket timestamp at the pass window to determine who made the error, and direct that person to remake the order immediately."],"answer":"C","rationale":"During a live service rush, the supervisor must stabilize guest service and safety first, then conduct fact-based process diagnosis once the immediate operational pressure subsides.","feedback":{"A":{"type":"review","tag":"c5-o1","text":"Taking over the expeditor role avoids the relationship problem and removes your shift-wide oversight."},"B":{"type":"review","tag":"c5-o1","text":"A conduct warning alone may quiet the disagreement without protecting the delayed guest or correcting the ticket process."},"C":{"type":"preferred","text":"During a live service rush, the supervisor must stabilize guest service and safety first, then conduct fact-based process diagnosis once the immediate operational pressure subsides.","tag":"aligned"},"D":{"type":"review","tag":"c5-o1","text":"Pulling both workers away from a busy line could make safe service harder before the immediate problem is stabilized."},"E":{"type":"review","tag":"c5-o1","text":"Investigating blame while tickets wait makes the culprit more important than serving safely now."}},"family":"c5-o1","acceptable":{}},{"id":"C5Q02","chapter":5,"objective":1,"scenario":"Career staff and student workers make negative generalizations about one another. What helps?","choices":["Avoid the topic because differences in tenure make tension inevitable.","Hear work-related concerns and reinforce one consistent respect standard.","Assign the groups to separate shifts so they interact less often.","Use more experienced employees' preferences to settle disputed assignments.","Favor student requests to show that newer workers receive equal support."],"answer":"B","rationale":"Respectful conduct and task standards can apply across different backgrounds.","feedback":{"A":{"type":"review","tag":"c5-o1","text":"Avoidance lets repeated stereotypes affect collaboration and potentially future assignments."},"B":{"type":"preferred","text":"Respectful conduct and task standards can apply across different backgrounds.","tag":"aligned"},"C":{"type":"review","tag":"c5-o1","text":"Separating groups may reduce contact temporarily but leaves the underlying expectations unchanged."},"D":{"type":"review","tag":"c5-o1","text":"Tenure is a relevant source of expertise, not a blanket basis for settling every dispute."},"E":{"type":"review","tag":"c5-o1","text":"Favoring one group as a demonstration of fairness simply creates another inconsistent standard."}},"family":"c5-o1","acceptable":{}},{"id":"C5Q03","chapter":5,"objective":1,"scenario":"During afternoon prep, a cook imitates a coworker's accent while repeating a ticket call, and two nearby student workers laugh. The targeted coworker looks down and keeps working. How should you respond?","choices":["Redirect the prep team back to their production list in the moment, then address the joke privately with the cook at the end of the shift.","Remind the whole prep crew at tomorrow's pre-shift huddle that Maple Hall expects respectful communication from everyone on the line.","Move the cook to the back dishroom for the remainder of the shift to separate the workers while you consult the dining director.","Interrupt the remark immediately, state clearly that mocking coworkers is unacceptable at Maple Hall, and follow up privately under policy.","Check in privately with the targeted coworker after prep first, and take formal action with the cook if the coworker says they were offended."],"answer":"D","rationale":"When disrespectful conduct occurs publicly, onlookers take their cue from the supervisor's immediate response; interrupting the behavior in the moment upholds the conduct standard without shifting the burden onto the targeted employee.","feedback":{"A":{"type":"review","tag":"c5-o1","text":"Waiting until the shift ends leaves the public mockery unchallenged when coworkers hear it."},"B":{"type":"review","tag":"c5-o1","text":"A generic reminder tomorrow fails to address the current disrespectful act."},"C":{"type":"review","tag":"c5-o1","text":"Moving someone without a clear process may not address the conduct and its impact."},"D":{"type":"preferred","text":"When disrespectful conduct occurs publicly, onlookers take their cue from the supervisor's immediate response; interrupting the behavior in the moment upholds the conduct standard without shifting the burden onto the targeted employee.","tag":"aligned"},"E":{"type":"review","tag":"c5-o1","text":"The supervisor must address the behavior rather than putting responsibility solely on the targeted employee’s reaction."}},"family":"c5-o1","acceptable":{}},{"id":"C5Q04","chapter":5,"objective":2,"scenario":"Three people request the same Saturday off for different personal reasons. What is fair?","choices":["Deny all requests automatically so no employee thinks another was favored.","Approve the request involving family first, without reviewing shift coverage.","Prioritize a student activity over other reasons regardless of staffing policy.","Apply documented staffing criteria and explain the decision appropriately.","Have the employees negotiate among themselves and accept their final arrangement."],"answer":"D","rationale":"Transparent job-related criteria are fairer than ranking private circumstances.","feedback":{"A":{"type":"review","tag":"c5-o2","text":"Rejecting everyone’s request may avoid choosing, but not neces
